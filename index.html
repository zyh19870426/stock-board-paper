<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>打板模拟跟进 · 每日收益看板</title>
<style>
  :root{
    --bg:#0e1420; --panel:#161e2e; --panel2:#1b2438; --line:#2a3550;
    --tx:#dfe6f3; --tx2:#8fa0bf; --up:#f04a4a; --dn:#2fbf71;
    --s1:#4aa3f0; --s2:#f0a04a; --accent:#4aa3f0;
    --warn:#d97706;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--tx);font:14px/1.6 "Segoe UI","Microsoft YaHei",sans-serif;padding:16px 16px 60px}
  a{color:inherit}

  /* ============ 布局：左侧栏 + 右侧主区 ============ */
  .layout{max-width:1320px;margin:0 auto;display:grid;grid-template-columns:236px 1fr;gap:16px;align-items:start}
  @media(max-width:900px){.layout{grid-template-columns:1fr}}

  /* ---- 侧边栏 ---- */
  .side{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;position:sticky;top:16px}
  .side .sh{font-size:12px;color:var(--tx2);letter-spacing:.5px;margin-bottom:8px;padding-left:2px}
  .sitem{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:8px;cursor:pointer;border:1px solid transparent;transition:background .12s,border-color .12s;margin-bottom:4px}
  .sitem:hover{background:var(--panel2)}
  .sitem.on{background:var(--panel2);border-color:var(--accent)}
  .sitem .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
  .sitem .nm{flex:1;min-width:0}
  .sitem .nm .n1{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sitem .nm .n2{font-size:11px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sitem .rt{font-size:12px;font-weight:700;flex:0 0 auto;text-align:right}
  .sitem .rt .rv{display:block;font-size:13px}
  .sitem .rt .rd{display:block;font-size:10px;font-weight:500;opacity:.85}
  .side .snote{font-size:10.5px;color:var(--tx2);line-height:1.5;margin-top:10px;padding-top:9px;border-top:1px solid var(--line)}

  /* ---- 主区 ---- */
  .main{min-width:0}
  .hero{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
  .hero .h1{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .hero h1{font-size:19px;font-weight:600}
  .hero .sub{color:var(--tx2);font-size:12px;margin-top:4px}

  .hero .nav{margin-top:8px;font-size:12px}
  .hero .nav a{color:var(--accent);text-decoration:none;border:1px solid var(--line);border-radius:6px;padding:3px 10px;display:inline-block}
  .hero .nav a:hover{border-color:var(--accent)}

  /* 核心指标卡 */
  .kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:14px}
  .card{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:10px 12px}
  .card .t{font-size:11px;color:var(--tx2)}
  .card .v{font-size:19px;font-weight:700;margin-top:2px;letter-spacing:.2px}
  .card .m{font-size:10.5px;color:var(--tx2);margin-top:1px}
  .up{color:var(--up)} .dn{color:var(--dn)}

  #err{display:none;background:rgba(240,74,74,.1);border:1px solid rgba(240,74,74,.4);color:var(--up);border-radius:8px;padding:12px;margin:12px 0;font-size:13px}

  /* 滚动验证：只作为一个小徽章挂在 M2 卡片里（不再顶部占整条）
     ★ 2026-10-16 用户要求：「方向成立」这个提示弱化显示，作为一个标签，显示在 M2 跟随里面就行，
       没必要显示那么多细节 ⇒ 顶部整条 #rollbar 已删除，多窗口/显著性明细不再展示。 */
  .rolltag{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:12px;
    font-size:11.5px;font-weight:700;white-space:nowrap;vertical-align:middle}
  .rolltag.green{background:rgba(34,197,94,.16);color:#22c55e}
  .rolltag.watch{background:rgba(250,204,21,.16);color:#facc15}
  .rolltag.degrade{background:rgba(240,74,74,.16);color:var(--up)}
  .rolltag.insufficient{background:rgba(143,160,191,.15);color:var(--tx2)}
  .rollnote{font-size:11px;color:var(--tx2);margin-left:7px}

  /* 盘中实时 */
  .live{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:12px 0 0}
  .live .hd{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .live .hd b{font-size:14px}
  .badge{display:inline-block;padding:2px 10px;border-radius:12px;font-size:11.5px;font-weight:600}
  .badge.trading{background:rgba(240,74,74,.15);color:var(--up)}
  .badge.closed{background:rgba(143,160,191,.15);color:var(--tx2)}
  .badge.pre-open,.badge.holiday{background:rgba(74,163,240,.12);color:var(--s1)}
  .live .note{color:var(--tx2);font-size:11px;margin-top:3px}
  .live .lv-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;margin-top:11px}
  .live .lv{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
  .live .lv .nm{font-weight:600;margin-bottom:4px;font-size:13px}
  .live .lv .row{font-size:12px;color:var(--tx2);margin-top:2px}
  .live .lv .row b{color:var(--tx)}
  .live .lv .row.prev{background:rgba(217,119,6,.10);border-left:3px solid #d97706;border-radius:0 5px 5px 0;padding:3px 8px;margin-top:4px;color:#e0a45a}
  .live .lv .row.prev b{color:#f0b96a}
  .pick{display:inline-block;background:rgba(192,132,252,.14);color:#c084fc;padding:1px 8px;border-radius:4px;font-size:11.5px;font-weight:600}
  /* QMT 实盘区 · 与模拟账对比 */
  .qmt-cmp{margin-top:11px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
  .qmt-cmp .qchd{font-weight:600;font-size:12.5px;margin-bottom:6px}
  .qmt-cmp .crow{display:flex;gap:8px;align-items:baseline;font-size:12px;color:var(--tx2);padding:3px 0;flex-wrap:wrap;border-top:1px dashed var(--line)}
  .qmt-cmp .crow:first-of-type{border-top:none}
  .qmt-cmp .ck{flex:0 0 auto;min-width:84px;color:var(--tx);font-weight:600;font-size:11.5px}
  .qmt-cmp .cv{flex:1 1 320px;word-break:break-all}
  .qmt-cmp .cv b{color:var(--tx)}
  .qmt-cmp .cnote{font-size:11px;color:var(--tx2);line-height:1.65;margin-top:3px;padding-left:92px}

  /* 曲线区 */
  .winbar{display:flex;gap:7px;margin:16px 0 8px;align-items:center;flex-wrap:wrap}
  .winbar .wt{color:var(--tx2);font-size:12.5px}
  .winbar button{background:var(--panel);border:1px solid var(--line);color:var(--tx2);padding:4px 12px;border-radius:6px;cursor:pointer;font-size:12.5px}
  .winbar button.on{background:var(--panel2);color:var(--tx);border-color:var(--accent)}
  /* M2 切换轨迹（折叠在详情卡片内，不再挤在曲线窗口按钮那一行） */
  .swrow{margin-top:8px;padding-top:7px;border-top:1px dashed var(--line)}
  .swsum{font-size:11px;color:var(--tx2);cursor:pointer;line-height:1.6}
  .swsum b{color:var(--tx)}
  .swsum:hover{color:var(--tx)}
  .swsum .swmore{color:var(--accent);margin-left:4px}
  .swfull{font-size:11px;color:var(--tx2);line-height:1.8;margin-top:5px;word-break:break-all}
  .winbar .rt{font-size:10.5px;color:var(--tx2);cursor:help;border-bottom:1px dotted var(--tx2)}
  .chartbox{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}
  .chartbox .chead{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:8px}
  .chartbox .chead .cl{font-size:12.5px;font-weight:600}
  .chartbox .chead .cl small{color:var(--tx2);font-weight:400;margin-left:5px;font-size:11px}
  .chartbox .chead .legend{margin-left:auto;display:flex;gap:13px;font-size:11.5px;color:var(--tx2);flex-wrap:wrap}
  .chartbox .chead .legend i{display:inline-block;width:16px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}

  /* 详情区 */
  .stitle{margin:22px 0 8px;font-size:14.5px;font-weight:600;border-left:3px solid var(--accent);padding-left:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .stitle small{color:var(--tx2);font-weight:400;font-size:11.5px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:980px){.grid2{grid-template-columns:1fr}}
  table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:9px;overflow:hidden;font-size:12.5px}
  th,td{padding:6px 9px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
  th{background:var(--panel2);color:var(--tx2);font-weight:500;font-size:11.5px}
  td:first-child,th:first-child,td.l,th.l{text-align:left}
  tr:last-child td{border-bottom:none}
  .tag{display:inline-block;padding:1px 7px;border-radius:4px;font-size:11px}
  .tag.b{background:rgba(240,74,74,.14);color:var(--up)}
  .tag.s{background:rgba(47,191,113,.14);color:var(--dn)}
  .tag.sk{background:rgba(143,160,191,.15);color:var(--tx2)}
  .empty{background:var(--panel);border:1px dashed var(--line);border-radius:9px;padding:20px;text-align:center;color:var(--tx2);font-size:12.5px}
  .planmsg{background:var(--panel);border:1px dashed var(--line);border-radius:9px;padding:14px;color:var(--tx2);font-size:12.5px;line-height:1.7}
  /* 今日分时图卡片 */
  .mcharts{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px}
  /* ★ 成交明细里的分时图要「伸展开」（2026-10-17 用户要求）：用更宽的列宽，
     桌面端一行 2 张、每张约 650px；窄屏用 min() 兜底成 1 列，不溢出。 */
  .mcharts.wide{grid-template-columns:repeat(auto-fit,minmax(min(460px,100%),1fr));gap:12px}
  .mcharts.wide .mchart .mch{font-size:12.5px}
  .mchart{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:8px 9px 4px}
  .mchart .mch{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px;margin-bottom:5px;padding:0 2px}
  .mchart .mch .mcn{font-weight:600}
  .mchart .mch .mcc{color:var(--tx2);font-size:11px}
  .mchart .mch .mcl{color:#c084fc;font-size:11px}
  .mchart .mch .mcd{color:var(--tx2);font-size:11px;margin-left:auto}
  .mchart svg{display:block}
  .mchart .mclg{display:flex;gap:12px;font-size:10.5px;color:var(--tx2);padding:2px 2px 4px}
  .mchart .mclg span{display:inline-flex;align-items:center;gap:4px}
  .mchart .mclg i{display:inline-block;width:8px;height:8px;border-radius:50%}
  /* ★ 成交明细卡片底部小字：股数 / 盈亏（2026-10-17 用户要求，表格移除后信息都收进卡片） */
  .mchart .mcfoot{display:flex;flex-wrap:wrap;gap:3px 12px;align-items:center;font-size:10.5px;color:var(--tx2);padding:4px 2px 5px;border-top:1px dashed var(--line);margin-top:4px}
  .mchart .mcfoot b{font-weight:600;color:var(--tx)}
  .mchart .mnochart{color:var(--tx2);font-size:10.5px;line-height:1.7;padding:14px 6px;text-align:center;border:1px dashed var(--line);border-radius:6px;margin:4px 0 2px}

  /* ============ 表格手机适配（≤760px）：表格 → 卡片堆叠 ============
     ★ 2026-10-16 用户要求：今日持仓 / 成交明细 要符合手机屏幕宽度布局。
     现状 th,td{white-space:nowrap} 在窄屏必然横向撑破（持仓 8 列、成交明细 9 列）。
     方案：窄屏把每个 <tr> 变成一张独立小卡，每个 <td> 一行「字段名 : 值」。
     字段名从 <td data-l="…"> 取（桌面端该属性无用，不影响渲染）。
     ★ 任何 width:100% 的 table 在窄屏都靠这套兜底；不依赖 JS，纯 CSS。 */
  @media(max-width:760px){
    table{display:block;border:none;background:transparent;border-radius:0}
    /* 表头行（JS 统一加了 class="thead"）在窄屏隐藏，字段名改由每格的 data-l 承担 */
    table tr.thead{display:none}
    table tr{display:block;background:var(--panel);border:1px solid var(--line);
      border-radius:9px;padding:4px 2px;margin-bottom:9px}
    table td{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;
      border:none;padding:5px 10px;text-align:right;white-space:normal;word-break:break-word;line-height:1.5}
    table td::before{content:attr(data-l);color:var(--tx2);font-size:11.5px;
      flex:0 0 auto;text-align:left;font-weight:500;padding-top:1px}
    /* 没有字段名的整格（data-l="" 或未加）→ 不显示标签，左对齐整行铺满 */
    table td[data-l=""]::before,table td:not([data-l])::before{display:none}
    table td[data-l=""]{justify-content:flex-start;text-align:left}
    table td.l{text-align:right}
  }

  /* ============ 移动端抽屉（≤900px） ============
     PC 端侧边栏是常驻 sticky；手机上那样会变成一个挡在内容前的悬浮块、且页面在它后面滚动。
     改成标准抽屉：默认隐藏 → 点按钮从左滑出 → 选中后自动收起。
     实现用「transform 位移 + 遮罩」而非 display，保证有滑出动画。 */
  .menubtn,.scrim{display:none}          /* PC 端不显示 */
  @media(max-width:900px){
    /* 触发按钮：固定在左上角（不随内容滚动） */
    .menubtn{
      display:flex;align-items:center;gap:6px;position:fixed;left:12px;top:12px;z-index:60;
      background:var(--panel2);border:1px solid var(--line);border-radius:9px;
      padding:8px 13px;color:var(--tx);font-size:13px;font-weight:600;cursor:pointer;
      box-shadow:0 2px 10px rgba(0,0,0,.35);
    }
    .menubtn:active{background:var(--panel)}
    .menubtn .cur{color:#c084fc}
    /* 抽屉本体：固定定位 + 从左滑入 */
    .side{
      position:fixed;left:0;top:0;bottom:0;z-index:70;
      width:min(78vw,300px);border-radius:0 14px 14px 0;border-left:none;
      padding:14px;overflow-y:auto;-webkit-overflow-scrolling:touch;
      transform:translateX(-105%);transition:transform .22s ease;
      box-shadow:6px 0 24px rgba(0,0,0,.45);
    }
    .side.open{transform:translateX(0)}
    /* 遮罩：抽屉打开时盖住主内容，点它关闭 */
    .scrim{
      display:block;position:fixed;inset:0;z-index:65;background:rgba(0,0,0,.5);
      opacity:0;pointer-events:none;transition:opacity .22s ease;
    }
    .scrim.open{opacity:1;pointer-events:auto}
    /* 抽屉里给「关闭」留个明确出口 */
    .side .sclose{display:flex;justify-content:flex-end;margin-bottom:6px}
    .side .sclose button{background:var(--panel2);border:1px solid var(--line);color:var(--tx2);
      border-radius:7px;padding:5px 11px;font-size:12px;cursor:pointer}
    /* 给固定按钮让出顶部空间，避免压住标题 */
    body{padding-top:62px}
    .layout{gap:0}
  }
  /* 抽屉关闭按钮在 PC 端隐藏 */
  .side .sclose{display:none}
  @media(max-width:900px){ .side .sclose{display:flex} }
/* 侧边栏：视图切换入口 */
.sview{display:flex;gap:6px;padding:0 12px 10px}
.sview button{font:inherit;font-size:12px;padding:6px 8px;border-radius:8px;border:1px solid var(--line,#2a2a2a);background:var(--panel,#141414);color:var(--tx2,#999);cursor:pointer;flex:1;transition:.15s}
.sview button.on{background:rgba(74,163,240,.16);border-color:#4aa3f0;color:#4aa3f0;font-weight:600}
/* 辅助信息分区 */
.auxsec{margin:0 0 18px;border:1px solid var(--line,#2a2a2a);border-radius:12px;overflow:hidden;background:var(--panel,#141414)}
.auxhd{font-size:14px;font-weight:600;padding:10px 14px;background:var(--panel2,#1c1c1c);border-bottom:1px solid var(--line,#2a2a2a);color:var(--tx,#eee)}
.auxsec .live{margin:12px}
/* 数据时效横幅 */
#dataAge{display:none;margin:0 0 14px;padding:11px 14px;border-radius:12px;font-size:13px;line-height:1.5;font-weight:600}
#dataAge .a-sub{font-weight:400;opacity:.85;font-size:12px}
#dataAge.ok{display:block;background:rgba(46,160,67,.12);border:1px solid rgba(46,160,67,.4);color:#5fd17e}
#dataAge.warn{display:block;background:rgba(210,153,34,.14);border:1px solid rgba(210,153,34,.5);color:#e8b54e}
#dataAge.bad{display:block;background:rgba(220,60,60,.14);border:1px solid rgba(220,60,60,.55);color:#ff8080}
</style>
</head>
<body>

<!-- 移动端：抽屉触发按钮（PC 端隐藏）。显示当前策略，点了从左滑出策略列表 -->
<button class="menubtn" id="menubtn" aria-label="打开策略列表">
  <span style="font-size:15px;line-height:1">☰</span><span>策略</span><span class="cur" id="menucur">S3</span>
</button>
<!-- 移动端：抽屉遮罩，点它收起 -->
<div class="scrim" id="scrim"></div>

<div class="layout">

  <!-- ==================== 左侧：策略侧边栏（PC 常驻 sticky / 手机抽屉） ==================== -->
  <aside class="side" id="side">
    <div class="sclose"><button id="sideclose">收起 ✕</button></div>
    <div class="sh">视图</div>
    <div class="sview" id="sview">
      <button data-view="main" class="on">看板主页</button>
      <button data-view="aux">辅助信息</button>
    </div>
    <div class="sh">策略列表</div>
    <div id="sidelist"></div>
    <div class="snote">
      <div>点选任意策略 → 看该套详情</div>
      <div style="margin-top:5px">各策略独立本金、互不干扰</div>
    </div>
  </aside>

  <!-- ==================== 右侧：主区 ==================== -->
  <main class="main">
    <!-- QMT 策略健康横幅：只在 status!=ok 时由脚本显示 -->
    <div id="qmtHealth" style="display:none"></div>

    <!-- ★ 数据时效横幅：看板停更时主动变黄/变红，避免"几天后才发现没更新" -->
    <div id="dataAge" style="display:none"></div>

    <!-- ============ 主页视图：KPI + 收益曲线 + 持仓操作核心 ============ -->
    <div id="mainview">
      <div class="hero">
        <div class="h1">
          <h1 id="ptitle">打板模拟跟进</h1>
          <span id="pbadge"></span>
        </div>
        <div class="sub" id="sub">加载中…</div>
        <div id="err"></div>
        <div class="kpi" id="kpi"></div>
      </div>

      <!-- 收益曲线 -->
      <div class="winbar">
        <span class="wt">收益曲线</span>
        <button data-m="live" class="on">线上模拟</button>
        <button data-m="replay">历史回放</button>
        <span id="winwrap" style="display:none;gap:7px;align-items:center">
          <button data-w="7">7天</button><button data-w="30" class="on">30天</button>
          <button data-w="60">60天</button><button data-w="90">90天</button>
          <button data-w="0">全部</button>
        </span>
      </div>
      <div class="chartbox">
        <div class="chead">
          <span class="cl" id="chartTitle">累计收益率</span>
          <span class="legend" id="legend"></span>
        </div>
        <svg id="chart" width="100%" height="250" preserveAspectRatio="none"></svg>
      </div>

      <!-- 详情区（随侧边栏切换）：持仓 / 今日成交 / 明日计划 / 分时 / 成交明细 -->
      <div id="detail"></div>
    </div>

    <!-- ============ 辅助信息视图：实盘 / 模拟 / 风控 / 走势 / 战绩 ============ -->
    <div id="aux" style="display:none">
      <section class="auxsec">

</div>

<script>
'use strict'
/* ★ CUR 初值留空：render() 会自动落到 DATA.mainId（= 线上主策略 S3）。
   早先写死 'M2'，导致 M2 存在时永远不会被主策略覆盖，默认页停在对照策略上。 */
var DATA = null, WIN = 30, CUR = ''   /* ★ 2026-10-20：默认 30 天窗口（仅 replay 模式生效） */
/* ★ 2026-10-20：MODE 决定曲线数据源。'live' = 线上模拟账户（daily，上线日至今，默认）；
   'replay' = 同参数历史回放（curve，6 年）。用户要看的是模拟盘真实收益，回测只是备查。 */
var MODE = 'live'
/* ★ 2026-10-21：公开页面不展示 S3（线上主策略）入口，也不展示 M2/S2 对照。
   数据仍留在 dashboard.json 里，随时可放出来。 */
var HIDE = ['M2', 'S2', 'S3']
function visibleOf (S) { return (S || []).filter(function (s) { return HIDE.indexOf(s.id) < 0 }) }
/* ★ 2026-10-22：视图切换。
   'main' = 看板主页（KPI + 收益曲线 + 主策略详情的持仓/成交/计划/分时核心）；
   'aux'  = 辅助信息页（主策略详情的风控/当日盈亏走势/样本外战绩 + QMT 实盘 + 云端模拟实时 + 云端模拟对比）。
   入口在侧边栏顶部「视图」分组。 */
var VIEW = 'main'
function setView (v) {
  VIEW = v
  document.getElementById('mainview').style.display = v === 'main' ? '' : 'none'
  document.getElementById('aux').style.display = v === 'aux' ? '' : 'none'
  var btns = document.querySelectorAll('#sview button')
  for (var i = 0; i < btns.length; i++) btns[i].classList.toggle('on', btns[i].dataset.view === v)
}
;(function () {
  var sv = document.getElementById('sview')
  if (sv) sv.querySelectorAll('button').forEach(function (b) { b.onclick = function () { setView(b.dataset.view) } })
  setView('main')
})()
var PAL = ['#c084fc', '#4aa3f0', '#f0a04a', '#4dd0a0', '#f472b6', '#facc15', '#38bdf8', '#fb923c']
var IDS = []
function colorOf (id) {
  var i = IDS.indexOf(id)
  if (i < 0) { IDS.push(id); i = IDS.length - 1 }
  return PAL[i % PAL.length]
}
var fmtYuan = c => (c<0?'-':'') + Math.abs(c/100).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2})
var signYuan = c => (c>0?'+':'') + fmtYuan(c)
var pct = v => (v>0?'+':'') + (v*100).toFixed(2) + '%'
var cls = v => v>0?'up':(v<0?'dn':'')
var price = c => (c/100).toFixed(2)
var dnum = d => String(d==null?'':d).replace(/[^0-9]/g,'')
var cnDate = d => { var s=dnum(d); return s.length>=8 ? s.slice(0,4)+'-'+s.slice(4,6)+'-'+s.slice(6,8) : String(d==null?'':d) }
var mmdd = d => { var s=dnum(d); return s.length>=8 ? s.slice(4,6)+'-'+s.slice(6,8) : s }
var LIVE = null
/* ★ 2026-10-21 新增：浏览器直连行情（东财 JSONP）。
   背景：云端定时器（GitHub Actions 的 schedule）对高频 cron 会直接丢触发，
         实测 10-21 白天零触发 ⇒ 看板整天停在 20 号。
   分工：持仓清单一天变一次，交给云端跑批；「现价 / 今日盈亏」这种秒级的东西由页面自己拉，
         每 30 秒一次，不依赖任何 cron、不依赖本机开机。
   诚实边界：这里只刷新【价格】，不重算当日买卖事件；「今天买了/卖了什么」仍以跑批帧为准，
             页头会分别标出「行情时间」和「数据帧时间」。 */
var QUOTE = { at: null, ok: 0, fail: 0 }
var JSONP_SEQ = 0
function bjToday(){ return new Date(Date.now() + 8*3600*1000).toISOString().slice(0,10) }
function jsonpQuotes(codes, cb){
  if(!codes.length){ cb(null); return }
  var secids = codes.map(function(c){
    return (/^(6|9)/.test(c) ? '1' : '0') + '.' + c     /* 1=沪市 0=深市/北交所 */
  }).join(',')
  var fn = '__emq' + (++JSONP_SEQ)
  var s = document.createElement('script')
  var done = false
  function fin(v){
    if(done) return
    done = true
    clearTimeout(timer)
    try{ delete window[fn] }catch(e){ window[fn] = undefined }
    if(s.parentNode) s.parentNode.removeChild(s)
    cb(v)
  }
  var timer = setTimeout(function(){ fin(null) }, 8000)
  window[fn] = function(r){
    var m = {}
    try{ ((r && r.data && r.data.diff) || []).forEach(function(x){ if(x && x.f12) m[String(x.f12)] = x }) }catch(e){}
    fin(Object.keys(m).length ? m : null)
  }
  s.onerror = function(){ fin(null) }
  s.src = 'https://push2.eastmoney.com/api/qt/ulist.np/get?fltt=2&invt=2&fields=f2,f3,f12,f14,f18&secids=' + secids + '&cb=' + fn
  document.body.appendChild(s)
}
/* 用实时价重算某一帧策略的 市值/当日盈亏/累计 */
function quoteApplyTo(strategies, m, at){
  var touched = false
  strategies.forEach(function(s){
    var ps = s.positions || []
    if(!ps.length) return
    var mv = 0
    ps.forEach(function(p){
      var q = m[p.code]
      if(q && Number(q.f2) > 0){
        p.curC = Math.round(Number(q.f2) * 100)
        p.quoteAt = at
        touched = true
      }
      var c = (p.curC || p.buyC || 0)
      p.curPnlC = (c - (p.buyC || 0)) * (p.shares || 0)
      mv += c * (p.shares || 0)
    })
    if(!touched) return
    var prevTotal = (s.totalC || 0) - (s.dayPnlC || 0)       /* 昨收净值：帧自带，不用猜 */
    var initTotal = (s.cumRet != null && s.cumRet > -1) ? s.totalC/(1 + s.cumRet) : 0
    var newTotal = (s.cashC || 0) + mv
    s.mvC = mv
    s.totalC = newTotal
    if(prevTotal > 0){
      s.dayPnlC = newTotal - prevTotal
      s.dayRet = s.dayPnlC / prevTotal
    }
    if(initTotal > 0) s.cumRet = newTotal/initTotal - 1
  })
  return touched
}
function applyQuotes(){
  if(!LIVE || !LIVE.strategies || !LIVE.strategies.length) return
  if(LIVE.phase !== 'trading') return
  if(String(LIVE.bjDate) !== bjToday()) return                /* 帧不是今天的 ⇒ 不刷，避免用今天的价套昨天的持仓 */
  var codes = []
  LIVE.strategies.forEach(function(s){
    (s.positions || []).forEach(function(p){ if(p.code && codes.indexOf(p.code) < 0) codes.push(p.code) })
  })
  if(!codes.length) return
  jsonpQuotes(codes, function(m){
    if(!m){ QUOTE.fail++; return }
    QUOTE.fail = 0
    var at = new Date()
    if(!quoteApplyTo(LIVE.strategies, m, at.toISOString())) return
    QUOTE.at = at
    QUOTE.ok++
    renderLive()
    if(DATA) render(DATA)
  })
}
var MCHART = null          /* 当日分时序列（data/minute-chart.json），画「今日操作股票」的分时图 */
var MTRADE = null          /* 成交明细专用分时（data/minute-trade.json），按 code+date 精确取，回填近 20 个交易日 */
var ISER = null            /* 盘中净值序列（data/intraday-series.json）：最近 10 个交易日、每 15 分钟一帧 */
var IDAY = null            /* 盘中曲线当前查看的日期（默认最新一天） */

/* ---------- 数据拉取 ---------- */
/* ★ 2026-10-20：dashboard.json ≈ 700KB，网络慢时要 5~10 秒。旧版加载中无任何提示、
   失败不重试 ⇒ 用户看到一片空白分不清「在加载」还是「坏了」。现在：加载中先在曲线区
   显示提示，失败自动重试 3 次（间隔 2 秒），仍失败才报错。 */
var FETCH_RETRY = 0
function fetchJSON(){
  var t = Date.now()
  var chart = document.getElementById('chart')
  if(chart && !DATA) chart.innerHTML = '<text x="50%" y="125" fill="#8fa0bf" font-size="13" text-anchor="middle">正在加载看板数据（约 700KB，网络慢时需数秒）…</text>'
  fetch('./data/dashboard.json?_='+t).then(r=>{
    if(!r.ok) throw new Error('HTTP '+r.status)
    return r.json()
  }).then(function(j){ FETCH_RETRY = 0; render(j);
    /* ★ DATA 到位后必须重画 QMT 区块：它的「模拟侧闸门」取自 dashboard.json 的 risk.gateToday，
       而 loadQmt 往往先于 dashboard 返回（3476 B vs 700KB）⇒ 不重画就会一直显示「无记录」。 */
    if(QMT) renderQmt() }).catch(e=>{
    if(FETCH_RETRY < 3){
      FETCH_RETRY++
      if(chart && !DATA) chart.innerHTML = '<text x="50%" y="125" fill="#e0a020" font-size="13" text-anchor="middle">数据加载失败（'+e.message+'），'+FETCH_RETRY+'/3 次重试中…</text>'
      setTimeout(fetchJSON, 2000)
      return
    }
    var el = document.getElementById('err')
    el.style.display='block'
    el.textContent = '数据加载失败：'+e.message+'。若是本地直接双击打开，请访问线上地址（GitHub Pages）；线上页面则等每日任务跑完后 2~3 分钟再刷新。'
    document.getElementById('sub').textContent = '加载失败'
  })
}
function loadLive(){
  fetch('./data/intraday.json?_='+Date.now(), {cache:'no-store'}).then(r=> r.ok ? r.json() : null)
    .then(function(j){ LIVE = j; applyQuotes(); renderLive(); if(DATA) render(DATA); if(QMT) renderQmt() }).catch(function(){ /* 保留上一次 */ })
}
/* ★ 盘中净值序列（2026-10-19 起）
   intraday-series.json 只增不删、保留最近 10 个交易日 ⇒ 收盘后也一直能看当日盈亏怎么变的。 */
function loadSeries(){
  fetch('./data/intraday-series.json?_='+Date.now(), {cache:'no-store'}).then(function(r){ return r.ok ? r.json() : null })
    .then(function(j){ ISER = j; if(DATA){ renderDetail('main'); renderDetail('aux') } }).catch(function(){ /* 缺失不影响看板 */ })
}
/* ★ 当日分时序列（画「今日操作股票」的分时图）。
   文件由每日收盘任务采集（lib/minute-chart.js），只留最近 8 个交易日。
   ★ 另外加载 minute-trade.json：成交明细专用，按 (code,date) 回填近 20 个交易日，
     使「每一笔成交」都能点开看到买入日 / 卖出日的分时与 B/S 时点。
   加载失败/文件不存在都不影响主看板（图区自行隐藏）。 */
function loadMinuteChart(){
  var a = fetch('./data/minute-chart.json?_='+Date.now(), {cache:'no-store'})
    .then(function(r){ return r.ok ? r.json() : null })
    .then(function(j){ MCHART = (j && Array.isArray(j.rows)) ? j : null })
    .catch(function(){ MCHART = null })
  var b = fetch('./data/minute-trade.json?_='+Date.now(), {cache:'no-store'})
    .then(function(r){ return r.ok ? r.json() : null })
    .then(function(j){ MTRADE = (j && Array.isArray(j.rows)) ? j : null })
    .catch(function(){ MTRADE = null })
  Promise.all([a,b]).then(function(){ if(DATA){ renderDetail('main'); renderDetail('aux') } })
}

/* ★ 盘中实时并入：LIVE 快照比正式看板新一个交易日时，顶部数字用实时值并标 ⚡实时。
   ★ 曲线也要追加当日实时点：否则盘中曲线停在昨日，看不出今天的变化。
     规则 = 先剔掉 LIVE 同日的旧点（防重复计点），再追加一个 live 点；收敛后由收盘跑转正。 */
function mergedStrategies(){
  if(!DATA) return []
  /* ★ 必须要求 bjDate 有效（'YYYY-MM-DD'，8 位数字）：
     否则 String(undefined) <= String('2026-10-14') 会因 'u' > '2' 判 false ⇒ 误进合并分支，
     给 daily 追加一个没有日期的脏点（曲线会多出一个 x 对不上的点）。 */
  if(!LIVE || LIVE.phase==='holiday' || !LIVE.strategies || !LIVE.strategies.length) return DATA.strategies
  if(!/^\d{8}$/.test(dnum(LIVE.bjDate))) return DATA.strategies
  if(String(LIVE.bjDate) <= String(DATA.date)) return DATA.strategies
  return DATA.strategies.map(function(s){
    var lv = null
    LIVE.strategies.forEach(function(x){ if(x.id===s.id) lv = x })
    if(!lv) return s
    var daily = (s.daily||[]).filter(function(p){ return p.d !== LIVE.bjDate })
    daily = daily.concat([{ d: LIVE.bjDate, tc: lv.totalC, dp: lv.dayPnlC, dr: lv.dayRet, cr: lv.cumRet, live: 1 }])
    return Object.assign({}, s, {
      dayPnlC: lv.dayPnlC, dayRet: lv.dayRet, cumRet: lv.cumRet,
      cumPnlC: lv.totalC - DATA.initialCash*100,
      totalC: lv.totalC,
      daily: daily,
      positions: lv.positions || s.positions,
      todayBuys: lv.todayBuys || [], todaySells: lv.todaySells || [],
      live: LIVE.phase==='trading' ? 1 : 0
    })
  })
}
function liveTagOf(s){ return s && s.live ? ' ⚡实时' : '' }
function stratById(id){ return mergedStrategies().filter(function(s){ return s.id===id })[0] || null }

/* ---------- 侧边栏 ---------- */
/* 侧边栏副标题：短名（去掉「策略N · 」前缀），M2 特殊标注 */
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') }
function shortName(s){
  return String(s.name||'').replace(/^策略[A-Za-z0-9]+\s*·\s*/,'').replace(/^跟随·/,'')
}
/* 详情/曲线标题用。
 * ★ 2026-10-21：公开页不显示策略全名 —— 原名会带出构成（如「首板排机构票（S3+排龙虎榜机构）」），
 *   等于把方法论写在标题上。这里统一换成中性代号，真实名称只在本地/私有仓库可见。 */
var SEC_NAME = { E1: '主策略', M1: '组合策略', S1: '对照 A', S3: '对照 B', M2: '跟随' }
function displayName(s){
  return SEC_NAME[s.id] || s.id
}
/* ★ lbcRange 形如 "2<N<4"，裸 < 会被 HTML 当标签吞掉 ⇒ 统一转义 */
function sideSub(s){
  /* ★ 2026-10-21：公开页不写死策略参数（调仓日/只数/份数/连板区间），只留一句定位语。 */
  if(s.id==='M1') return '组合'
  if(s.id==='E1') return '主策略'
  return ''
}
function renderSide(){
  var S = visibleOf(mergedStrategies())
  var box = document.getElementById('sidelist')
  box.innerHTML = S.map(function(s){
    var c = colorOf(s.id)
    var isMain = !s.isRef
    /* ★ 2026-10-20：列表只显示代码（M1/S3/E1/S1），不再挂长昵称——详情区标题里有全名。 */
    var badge = s.id === 'M1'
      ? '<span class="tag b" style="font-size:10px;padding:0 5px;margin-right:5px">组合</span>'
      : (isMain
          ? '<span class="tag b" style="font-size:10px;padding:0 5px;margin-right:5px">主策略</span>'
          : '<span class="tag sk" style="font-size:10px;padding:0 5px;margin-right:5px">对照</span>')
    /* M1 是正式在跑的组合策略，不弱化（它与 S3/E1 是并列关系，不是「对照组」） */
    var dim = (isMain || s.id === 'M1') ? '' : ' style="opacity:.62"'
    return '<div class="sitem'+(s.id===CUR?' on':'')+'" data-id="'+s.id+'"'+dim+'>'
      + '<span class="dot" style="background:'+c+'"></span>'
      + '<span class="nm"><span class="n1">'+badge+s.id+'</span>'
      + '<span class="n2">'+sideSub(s)+'</span></span>'
      + '<span class="rt"><span class="rv '+cls(s.cumRet)+'">'+pct(s.cumRet)+'</span>'
      + '<span class="rd '+cls(s.dayRet)+'">今日 '+pct(s.dayRet)+'</span></span>'
      + '</div>'
  }).join('')
  box.querySelectorAll('.sitem').forEach(function(el){
    el.onclick = function(){
      CUR = this.dataset.id
      var mc = document.getElementById('menucur'); if(mc) mc.textContent = CUR
      renderSide(); renderHero(); renderLive(); renderDetail('main'); renderDetail('aux'); renderQmt(); drawChart()
      closeSide()          /* ★ 手机上选完自动收起抽屉，让详情立刻可见 */
    }
  })
}

/* ---------- 移动端抽屉开合 ----------
 * PC 端：.side 是常驻 sticky，这些操作无副作用（class 加了也不影响 grid 布局）。
 * 手机端：默认 transform 移出屏幕，open 才滑入；遮罩点击/选策略/按 ESC 均可关闭。 */
function openSide(){
  document.getElementById('side').classList.add('open')
  document.getElementById('scrim').classList.add('open')
  document.documentElement.style.overflow = 'hidden'   /* 抽屉打开时锁定背景滚动 */
}
function closeSide(){
  document.getElementById('side').classList.remove('open')
  document.getElementById('scrim').classList.remove('open')
  document.documentElement.style.overflow = ''
}
function sideIsOpen(){ return document.getElementById('side').classList.contains('open') }

/* ---------- 顶部核心指标（只显示当前选中策略，默认 M2） ---------- */
function renderHero(){
  var s = stratById(CUR)
  if(!s) return
  var c = colorOf(s.id)
  document.getElementById('ptitle').innerHTML = '<span style="color:'+c+'">'+s.id+'</span> · '+displayName(s)
  document.getElementById('pbadge').innerHTML = s.id==='M2'
    ? '<span class="pick">跟随 · 近10日最强者</span>' : '<span class="pick" style="background:rgba(74,163,240,.14);color:#4aa3f0">固定参数</span>'
  document.getElementById('sub').innerHTML =
    '数据截至 <b>'+cnDate(DATA.date)+'</b> 收盘 · 更新于 '+new Date(DATA.updated).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai'})
    + ' · 起点 '+DATA.startDate+' · 每套策略本金 '+fmtYuan(DATA.initialCash*100)+' 元'
    + (s.live && LIVE ? ' · <span style="color:var(--warn)">顶部数字为盘中实时预演（'+LIVE.bjTime+'），以收盘跑为准</span>' : '')
  /* 底部口径小字已删除（用户要求），占位元素不再存在，写入前判空 */
  var fs0 = document.getElementById('fStart'); if (fs0) fs0.textContent = DATA.startDate
  var fr0 = document.getElementById('fReplay'); if (fr0) fr0.textContent = DATA.replayStart || '—'

  var h = ''
  h += card('当日盈亏'+liveTagOf(s), signYuan(s.dayPnlC)+' 元', cls(s.dayPnlC), '当日收益率 '+pct(s.dayRet))
  h += card('累计收益'+liveTagOf(s), pct(s.cumRet), cls(s.cumRet), '累计盈亏 '+signYuan(s.cumPnlC)+' 元')
  h += card('可用持仓金额', fmtYuan(s.cashC)+' 元', '', '已用市值 '+fmtYuan(s.mvC)+' 元')
  h += card('总资产'+liveTagOf(s), fmtYuan(s.totalC)+' 元', '', '现金＋市值')
  h += card('胜率 / 笔数', s.tradeCount ? (s.winRate*100).toFixed(1)+'% / '+s.tradeCount+' 笔' : '—', '', '最大回撤 '+(s.maxDrawdown*100).toFixed(2)+'%')
  document.getElementById('kpi').innerHTML = h
}

/* ---------- 数据时效横幅：把"停更"从静默变成一眼可见 ---------- */
function renderDataAge(){
  var box = document.getElementById('dataAge')
  if(!DATA || !DATA.date){ box.style.display = 'none'; return }
  /* 北京今天（按日期，忽略时分）；交易日滞后数 = DATA.date 次日 ~ 昨天之间的工作日数
     （不含今天，因为今天盘中/未收盘时 DATA.date 本就该是昨天，属正常） */
  var now = new Date()
  var bj = new Date(now.getTime() + now.getTimezoneOffset() * 60000 + 8 * 3600000)
  var yest = new Date(bj.getTime()); yest.setDate(yest.getDate() - 1)
  var d = new Date(DATA.date + 'T00:00:00+08:00')
  var cnt = 0
  var cur = new Date(d.getTime()); cur.setDate(cur.getDate() + 1)
  while(cur <= yest){
    var wd = cur.getDay()
    if(wd !== 0 && wd !== 6) cnt++
    cur.setDate(cur.getDate() + 1)
  }
  var updated = DATA.updated ? new Date(DATA.updated).toLocaleString('zh-CN', { timeZone: 'Asia/Shanghai' }) : '未知'
  if(cnt <= 0){
    box.className = 'ok'
    box.innerHTML = '✅ 数据正常：截至 <b>' + cnDate(DATA.date) + '</b> 收盘 · 更新于 ' + updated
      + '。盘中顶部数字为实时预演，以收盘为准。'
  } else if(cnt === 1){
    box.className = 'warn'
    box.innerHTML = '⚠️ 数据滞后 <b>1</b> 个交易日（仍停在 ' + cnDate(DATA.date) + ' 收盘）。'
      + '若已过了收盘时段仍未见更新，请检查云端 daily-paper 是否运行、本地同步是否覆盖。'
  } else {
    box.className = 'bad'
    box.innerHTML = '🔴 数据已滞后 <b>' + cnt + '</b> 个交易日（仍停在 ' + cnDate(DATA.date) + ' 收盘）。看板疑似停更！'
      + '排查：① 云端 daily-paper 运行记录；② 本地 push-github.js 是否手动 GH_ONLY 推了 data/（已默认禁止）覆盖云端。'
  }
  box.style.display = 'block'
}

/* ---------- 当日盈亏走势（盘中快照序列，最近 10 个交易日可切换） ---------- */
function setIDay(d){ IDAY = d; renderDetail('aux') }
function intradaySeriesHTML(sid){
  if(!ISER || !ISER.days) return ''
  var days = Object.keys(ISER.days).sort().slice(-10)
  if(!days.length) return ''
  if(!IDAY || !ISER.days[IDAY]) IDAY = days[days.length-1]
  var btns = days.map(function(d){
    return '<button onclick="setIDay(\''+d+'\')" style="margin:0 4px 4px 0;padding:3px 8px;border-radius:10px;border:1px solid '+(d===IDAY?'var(--line2,#3a3a3a)':'var(--line,#2a2a2a)')+';background:'+(d===IDAY?'var(--panel2,#1c1c1c)':'transparent')+';color:'+(d===IDAY?'var(--tx,#eee)':'var(--tx2,#999)')+';font-size:11px;cursor:pointer">'+mmdd(d)+'</button>'
  }).join('')
  var head = '<div class="stitle" style="font-size:13px">当日盈亏走势 · 盘中快照（'+esc(sid)+'）</div>'
  var dobj = ISER.days[IDAY] || {}
  var frames = (dobj.frames || []).filter(function(f){ return f.s && f.s[sid] })
  var bar = '<div style="margin:6px 2px 8px">'+btns+'</div>'
  if(frames.length < 2){
    return head + bar + '<div class="empty">'+cnDate(IDAY)+' 快照不足 2 帧（09:30 起每 15 分钟一帧，收盘跑补 15:00 定格）</div>'
  }
  var W = 680, H = 168, PL = 50, PR = 14, PT = 14, PB = 24
  var vals = frames.map(function(f){ return f.s[sid].dayRet || 0 })
  var mx = Math.max.apply(null, vals.concat([0]))
  var mn = Math.min.apply(null, vals.concat([0]))
  if(mx === mn){ mx += 0.002; mn -= 0.002 }
  var pad = (mx - mn) * 0.12; mx += pad; mn -= pad
  var X = function(i){ return PL + (W - PL - PR) * (frames.length === 1 ? 0.5 : i / (frames.length - 1)) }
  var Y = function(v){ return PT + (H - PT - PB) * (1 - (v - mn) / (mx - mn)) }
  var col = vals[vals.length-1] >= 0 ? '#e0483f' : '#1f9d6b'
  var dline = '', area = 'M ' + X(0) + ' ' + Y(0)
  frames.forEach(function(f, i){
    var v = f.s[sid].dayRet || 0
    dline += (i ? ' L ' : 'M ') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1)
    area += ' L ' + X(i).toFixed(1) + ' ' + Y(v).toFixed(1)
  })
  area += ' L ' + X(frames.length-1).toFixed(1) + ' ' + Y(0) + ' Z'
  var g = ''
  ;[mx, (mx+mn)/2, mn].forEach(function(v){
    g += '<line x1="'+PL+'" y1="'+Y(v).toFixed(1)+'" x2="'+(W-PR)+'" y2="'+Y(v).toFixed(1)+'" stroke="rgba(128,128,128,.16)" stroke-width="1"/>'
    g += '<text x="'+(PL-6)+'" y="'+(Y(v)+3.5).toFixed(1)+'" text-anchor="end" font-size="9.5" fill="rgba(150,150,150,.9)">'+(v*100).toFixed(2)+'%</text>'
  })
  var zero = '<line x1="'+PL+'" y1="'+Y(0).toFixed(1)+'" x2="'+(W-PR)+'" y2="'+Y(0).toFixed(1)+'" stroke="rgba(150,150,150,.55)" stroke-width="1" stroke-dasharray="4 3"/>'
  var last = frames[frames.length-1]
  var dot = '<circle cx="'+X(frames.length-1).toFixed(1)+'" cy="'+Y(vals[vals.length-1]).toFixed(1)+'" r="3.5" fill="'+col+'"/>'
    + '<text x="'+(X(frames.length-1)-4).toFixed(1)+'" y="'+(Y(vals[vals.length-1])-8).toFixed(1)+'" text-anchor="end" font-size="11" font-weight="600" fill="'+col+'">'+pct(vals[vals.length-1])+'</text>'
  var ticks = [0, Math.floor((frames.length-1)/2), frames.length-1].map(function(i){
    return '<text x="'+X(i).toFixed(1)+'" y="'+(H-6)+'" text-anchor="'+(i===0?'start':(i===frames.length-1?'end':'middle'))+'" font-size="9.5" fill="rgba(150,150,150,.9)">'+frames[i].t+'</text>'
  }).join('')
  var svg = '<svg viewBox="0 0 '+W+' '+H+'" width="100%" height="168" preserveAspectRatio="none" style="display:block">'
    + g + '<path d="'+area+'" fill="'+col+'" opacity=".10"/>' + zero
    + '<path d="'+dline+'" fill="none" stroke="'+col+'" stroke-width="1.8"/>' + dot + ticks + '</svg>'
  var hi = Math.max.apply(null, vals), lo = Math.min.apply(null, vals)
  var foot = '<div style="color:var(--tx2);font-size:11px;margin:6px 2px 0">'+cnDate(IDAY)
    + ' · 共 '+frames.length+' 帧 · 最新 '+last.t+' <b class="'+cls(vals[vals.length-1])+'">'+pct(vals[vals.length-1])+'</b>'
    + '　日内最高 <b class="'+cls(hi)+'">'+pct(hi)+'</b>　最低 <b class="'+cls(lo)+'">'+pct(lo)+'</b>'
    + '　（数值=当日收益率，含持仓浮动盈亏；盘中为预演，收盘跑转正）</div>'
  return head + bar + '<div style="background:var(--panel,#141414);border:1px solid var(--line,#2a2a2a);border-radius:10px;padding:8px 6px 2px">'+svg+'</div>' + foot
}

/* ---------- 详情区：持仓 / 当日盈亏 / 累计 / 可用金额 / 明日买入计划 ---------- */
/* ★ M1 专属卡片。2026-10-21：公开页不再写规则与参数（选股池/打分公式/缓冲/闸门阈值/费率），
   只保留「组合型」这一性质与当前状态。实现细节只在本地代码里。 */
function m1LogicHTML(s){
  /* ★ 2026-10-21：公开页不再展示选股池条件、打分公式、缓冲倍数、择时阈值、成交与费率规则。
     只保留「这是什么类型的策略」+ 当前状态，避免被反推。 */
  var rk = s.risk || {}
  var held = (s.positions || []).length
  var st = held ? ('当前持有 <b>' + held + '</b> 只') : '当前空仓'
  if(rk.nextRebalanceInDays != null) st += '　·　距下次调仓 <b>' + rk.nextRebalanceInDays + '</b> 个交易日'
  return '<div class="cards" style="display:grid;grid-template-columns:1fr;gap:10px;margin-bottom:12px"><div class="card" style="background:var(--panel)">'
    + '<div class="t">组合状态</div>'
    + '<div class="m" style="line-height:1.8;margin-bottom:4px">'
    + '不做打板。组合型策略，按固定节奏整体调仓，与打板策略的收益相关性接近 0，适合各配一半。'
    + '</div>'
    + '<div class="m" style="margin-top:8px;color:var(--tx2)">当前状态：'+st+'</div>'
    + '</div></div>'
}

/* ============================================================
 *  ★ 今日为什么没买 / 明日计划
 *  ★ 2026-10-21：公开页只输出「哪个环节拦住了 + 状态」，不输出阈值、比率、过滤条件、
 *    份数等任何可反推规则的细节。完整判定链只在本地与私有仓库。
 *  数据源：dashboard.json 的 risk.gateInfo / positions / nextCandidates，
 *          加 intraday.json 的 todayBuys / skippedToday。老数据缺字段时降级显示。
 * ============================================================ */
function whyNoBuyHTML(s){
  var rk = s.risk || {}
  var lv = null
  if(LIVE && LIVE.strategies) LIVE.strategies.forEach(function(x){ if(x.id === s.id) lv = x })
  var bj = (LIVE && LIVE.bjDate) || ''
  var decDate = s.date || DATA.date || ''
  var afterClose = !!(bj && decDate === bj)
  var phase = (LIVE && LIVE.phase) || 'closed'
  var slots = rk.slots || 1
  var pos = s.positions || []
  var buys = (((lv && lv.todayBuys) || s.todayBuys) || []).filter(function(b){ return b.preview !== true })
  var sk = (lv && lv.skippedToday) || []
  var cands = ((lv && lv.nextCandidates) || s.nextCandidates) || []
  var gi = rk.gateInfo || null
  var gateHit = !!rk.gateToday
  var ddPause = !!rk.ddPauseToday
  var posN = pos.length, freeN = Math.max(0, slots - posN)
  var C_OK = 'var(--s1)', C_STOP = 'var(--warn)', C_NA = 'var(--tx2)'
  var rows = [], firstStop = null
  function add(icon, color, label, txt){
    rows.push('<div style="display:flex;gap:8px;align-items:flex-start;margin-top:5px;font-size:12.5px">'
      + '<span style="flex:0 0 14px;color:' + color + ';font-weight:700">' + icon + '</span>'
      + '<span style="flex:0 0 76px;color:' + C_NA + '">' + label + '</span>'
      + '<span style="flex:1;min-width:0;color:var(--tx)">' + txt + '</span></div>')
  }
  function stop(label){ if(!firstStop) firstStop = { label: label } }

  /* ① 闸门（★ 2026-10-21：公开页只给开/关，不显示再封率、阈值、分位、样本数） */
  if(gi || rk.gatedDays != null){
    if(gateHit){
      add('✗', C_STOP, '情绪闸门', '关闭 ⇒ 当晚不选股，次日不开新仓')
      stop('情绪闸门关闭')
    } else {
      add('✓', C_OK, '情绪闸门', '开放')
    }
  } else {
    add('–', C_NA, '情绪闸门', '本策略未启用')
  }

  /* ② 回撤熔断 */
  if(ddPause){
    add('✗', C_STOP, '回撤熔断', '停手中 ⇒ 暂不开新仓')
    stop('回撤熔断停手')
  } else if(rk.ddTriggerCount > 0){
    add('✓', C_OK, '回撤熔断', '正常（当前不在停手期）')
  } else {
    add('–', C_NA, '回撤熔断', '现役未启用')
  }

  /* ③ 名额（只给有无空位，不显示份数与持仓名） */
  if(freeN <= 0){
    add('✗', C_STOP, '空余名额', '已满 ⇒ 即使有候选也不买')
    stop('名额已满')
  } else {
    add('✓', C_OK, '空余名额', '有空位')
  }

  /* ④ 候选（保留「有几只、叫什麼」这类执行结果，删掉过滤条件说明） */
  if(cands.length){
    add('✓', C_OK, '候选(' + decDate + ')', '<b>' + cands.length + ' 只</b>：'
      + cands.slice(0, 5).map(function(c){ return c.name + '(' + c.code + ')' }).join('、')
      + (cands.length > 5 ? ' 等' : ''))
  } else if(gateHit || ddPause){
    add('✗', C_STOP, '候选(' + decDate + ')', '未进入选股（被上游环节拦下）')
  } else {
    add('✗', C_STOP, '候选(' + decDate + ')', '无符合条件的标的')
    stop('当日无合格候选')
  }

  /* ⑤ 执行（只在当日有意义） */
  if(!afterClose){
    if(buys.length){
      add('✓', C_OK, '执行', '已买入 ' + buys.length + ' 只：'
        + buys.map(function(b){ return b.name + ' ' + b.shares + ' 股 @ ' + price(b.buyC) }).join('、'))
    } else if(sk.length){
      add('✗', C_STOP, '执行', '有候选但买不进：' + sk.map(function(x){ return x.name + '（' + x.reason + '）' }).join('、'))
      stop('开盘买不进', sk.map(function(x){ return x.name + '：' + x.reason }).join('；'))
    } else if(phase === 'pre-open'){
      add('⏳', C_NA, '执行', '未到 09:30 开盘（只挂 09:30~09:35 的买入窗口）')
    } else if(phase === 'auction'){
      add('⏳', C_NA, '执行', '集合竞价中，09:30 出今开后按开盘价买入')
    } else if(freeN > 0 && cands.length){
      add('⏳', C_NA, '执行', '在买入窗口内，等开盘价确认（若一字涨停则买不进）')
    }
  }

  /* 结论行 */
  var concl, ccol
  if(afterClose){
    if(buys.length){ concl = '今日已买入 ' + buys.length + ' 只'; ccol = C_OK }
    else if(firstStop){ concl = '下一个交易日不买入 —— ' + firstStop.label; ccol = C_STOP }
    else { concl = '下一个交易日按候选开盘买入'; ccol = C_OK }
  } else {
    if(buys.length){ concl = '今日已买入 ' + buys.length + ' 只'; ccol = C_OK }
    else if(firstStop){ concl = '今日不买入 —— ' + firstStop.label; ccol = C_STOP }
    else if(posN >= slots){ concl = '今日不买入 —— 名额已满'; ccol = C_STOP }
    else { concl = '今日无买入动作（规则未触发）'; ccol = C_NA }
  }
  var h = '<div style="background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:11px 13px;margin-bottom:12px">'
    + '<div style="font-size:11px;color:var(--tx2);display:flex;gap:8px;flex-wrap:wrap;align-items:baseline">'
      + '<span>' + (afterClose ? '明日买入计划' : '今日为什么不买') + '　·　依据 ' + esc(decDate) + ' 收盘</span>'
      + (bj ? '<span style="opacity:.75">页面日期 ' + esc(bj) + ' · ' + esc(phase) + '</span>' : '')
    + '</div>'
    + '<div style="margin-top:5px;font-size:14px;font-weight:600;color:' + ccol + '">' + concl + '</div>'
    + rows.join('')
    + '</div></div>'
  return h
}

function renderDetail(where){
  var s = stratById(CUR)
  var box = document.getElementById(where==='aux' ? 'aux-detail' : 'detail')
  if(!s){ box.innerHTML=''; return }
  var c = colorOf(s.id)

  /* ★ 2026-10-22：辅助信息视图只渲染「风控状态 + 当日盈亏走势 + 样本外战绩」三张卡 */
  if(where==='aux'){
    var ha = '<div class="stitle" style="border-color:'+c+'">'+s.id+' · '+displayName(s)+' · 风控 / 当日盈亏走势 / 样本外战绩'
      + (s.brief ? '<small>'+esc(s.brief)+'</small>' : '') + '</div>'
    if(s.risk && s.id!=='M1'){
      var rk = s.risk
      var perSlot = Math.round(s.totalC / (rk.slots || 1) / 100)
      var gateHTML = rk.gatedDays
        ? (rk.gateToday
            ? '<span class="tag sk">🚫 今日过热 → 明日不开新仓</span>'
            : '<span class="tag b">✅ 今日正常，可开新仓</span>')
          + '<span style="color:var(--tx2);font-size:11px">　自上线以来累计拦截 ' + rk.gatedDays + ' 个交易日</span>'
        : '<span style="color:var(--tx2);font-size:11px">本策略未启用情绪闸门</span>'
      var ddHTML = (rk.ddTriggerCount || rk.ddPauseToday)
        ? (rk.ddPauseToday
            ? '<span class="tag sk">⏸ 回撤熔断中：还剩 ' + rk.ddPauseLeft + ' 个交易日不开新仓</span>'
            : '<span class="tag b">✅ 未停手</span>')
          + '<span style="color:var(--tx2);font-size:11px">　历史触发 ' + rk.ddTriggerCount + ' 次</span>'
        : '<span class="tag b">✅ 未停手</span><span style="color:var(--tx2);font-size:11px">　本策略未启用回撤熔断</span>'
      ha += '<div class="cards" style="display:grid;grid-template-columns:1fr;gap:10px;margin-bottom:12px"><div class="card" style="background:var(--panel)">'
        + '<div class="t">风控状态 · 人为跟随</div>'
        + '<div class="m">' + gateHTML + '</div>'
        + '<div class="m" style="margin-top:3px">' + ddHTML + '</div>'
        + '<div class="m" style="margin-top:3px">每份约 <b>' + perSlot.toLocaleString() + ' 元</b>'
          + '　·　风险控制：止损 / 回撤 / 持有上限（参数不公开）</div>'
        + '</div></div>'
    }
    var ish = intradaySeriesHTML(s.id)
    if(ish) ha += '<div style="margin:14px 0 4px">'+ish+'</div>'
    var lsh = liveStatsHTML(s)
    if(lsh) ha += '<div style="margin:14px 0 4px">'+lsh+'</div>'
    box.innerHTML = ha
    return
  }

  var refTag = s.id === 'M1'
    ? '<span class="tag b" style="font-size:10px;padding:0 5px;margin-left:6px">组合引擎</span>'
    : (s.isRef ? '<span class="tag sk" style="font-size:10px;padding:0 5px;margin-left:6px">对照组 · 不作为操作依据</span>' : '<span class="tag b" style="font-size:10px;padding:0 5px;margin-left:6px">主策略</span>')
  var h = '<div class="stitle" style="border-color:'+c+'">'+s.id+' · '+displayName(s)+' 详情'
    + refTag
    + (s.brief ? '<small>'+esc(s.brief)+'</small>' : '') + '</div>'

  /* M1 专属：策略逻辑卡片（放在最前，先解释再给数字） */
  if(s.id === 'M1') h += m1LogicHTML(s)

  /* M2 专属：今日跟随谁 + 依据（切换轨迹折叠在卡片内）
     ★ 「方向成立」等滚动验证状态已弱化为这个小卡片里的一个徽章（顶部整条已撤）。 */
  if(s.m2){
    h += '<div class="cards" style="display:grid;grid-template-columns:1fr;gap:10px;margin-bottom:12px"><div class="card" style="background:var(--panel)">'
      + '<div class="t">今日跟随</div>'
      + '<div class="v"><span class="pick">'+s.m2.pickToday.name+'</span>'+rollTagHTML(DATA)+'</div>'

  if(tch){
    h += '<div class="stitle" style="border-color:'+c+';font-size:13px">成交明细'+(s.live?'（⚡实时）':'')+' · 最近 10 个交易日（累计 '+tTotal+' 笔）</div>'

/* ================= 今日分时图（SVG） =================
 * 数据：MCHART = { rows:[{date,code,name,prevC,bars:[{t,o,h,l,c,v}]}] }（lbc 已从公开数据剔除）
 * 规则：
 *   · 只画「该票最新一天」的序列（最近一个交易日有数据就用它）；
 *   · y 轴以「昨收」为基准对称，涨红跌绿（A 股口径）；
 *   · 叠一条均价线（累计成交额/累计成交量）与一条昨收虚线；
 *   · 09:35 起画（5 分钟粒度），横轴标 09:35 / 11:30 / 14:00 / 15:00 附近刻度；
 *   · ★ 叠「买卖点」标记：B（买，红实心）/ S（卖，绿实心），价按实际成交价贴到对应 bar 上。
 */
/* ================= 成交明细 · B/S 时点条 =================
 * 为什么（2026-10-17 用户要求）：
 *   成交明细只有「价格/股数/盈亏」，看不出这笔单子落在当日分时的什么位置。
 *   策略是固定规则：买入 = T+1 开盘 09:30；卖出 = 断板 14:57 尾盘集合竞价 / 到期 15:00 收盘。
 *   ⇒ 不需要分钟数据也能画出「时点位置」（全历史可用）。
 *   ⇒ 该票该日若在 minute-chart.json 里（最近 8 个交易日），整行可点开看真分时并标 B/S。
 */
function sellTimeOf(t){
  var r = String(t && t.reason || '')
  if(/退市|数据终止/.test(r)) return null          /* 强平价不可定时刻 */
  if(/最大持有|到期/.test(r)) return '15:00'        /* 收盘价到期 */
  return '14:57'                                   /* 断板 → 尾盘集合竞价 */
}
/* 09:30→0，11:30/13:00→120（午休折叠），15:00→240（单位：交易分钟） */
function tMin(hhmm){
  var m = String(hhmm||'').match(/(\d{1,2}):(\d{2})/)
  if(!m) return null
  var v = +m[1]*60 + +m[2]
  if(v <= 9*60+30) return 0
  if(v <= 11*60+30) return v - (9*60+30)
  if(v < 13*60) return 120
  if(v >= 15*60) return 240
  return 120 + (v - 13*60)
}

function seriesOf(code, date){
  var pools = []
  if(MCHART && MCHART.rows) pools.push(MCHART)
  if(MTRADE && MTRADE.rows) pools.push(MTRADE)
  var best = null
  pools.forEach(function(src){
    src.rows.forEach(function(r){
      if(r.code!==code) return
      if(date && String(r.date)!==String(date)) return
      if(!r.bars || r.bars.length<2) return
      if(!best || String(r.date) > String(best.date)) best = r
    })
  })
  return best
}
/* 把「成交时间(09:35 形式的 bar 键)」落到 bars 的下标上。
 * 规则：取第一个 t >= 成交时间的 bar；成交时间早于首根则归到第 0 根（开盘买）。
 * 无成交时间（老交易记录）⇒ 用 fallbackIdx（买=0 开盘；卖=末根 收盘）。 */
function barIdxByTime(bars, hhmm, fallbackIdx){
  if(hhmm && /^\d{2}:\d{2}$/.test(hhmm)){
    for(var i=0;i<bars.length;i++){ if(bars[i].t >= hhmm) return i }
    return bars.length-1
  }
  return fallbackIdx
}
/* 归一化成交时间到「5 分钟 bar 键」（新浪 scale=5 的 bar 结束时刻）：
 *   <09:35 → 09:35（开盘段，首根）
 *   09:35–11:30 → 向上取整到 5 分（如 09:33→09:35、09:36→09:40）
 *   11:31–13:04 → 13:05（午休，午后首根）
 *   13:05–15:00 → 向上取整到 5 分
 *   ≥15:00 → 15:00（收盘）
 * 说明：bar 键 = 该 5 分钟区间的「结束时刻」（新浪约定）。 */
function toBarKey(t){
  if(!t) return null
  var m = String(t).match(/(\d{1,2}):(\d{2})/)
  if(!m) return null
  var hh = +m[1], mi = +m[2]
  var mins = hh*60 + mi
  if(mins < 9*60+35) return '09:35'
  if(mins > 11*60+30 && mins < 13*60+5) return '13:05'
  if(mins >= 15*60) return '15:00'
  var up = Math.ceil(mins/5)*5                       /* 向上取整到 5 分 */
  var uh = Math.floor(up/60), um = up % 60
  return (uh<10?'0':'')+uh+':'+(um<10?'0':'')+um
}
function minuteChartSVG(rec, tag, name, lbc, marks, opts){
  var o = opts || {}
  var big = !!o.big
  var W = big ? 760 : 360
  var H = big ? 312 : 172
  var padL = 6, padR = big ? 62 : 46, padT = big ? 16 : 10, padB = big ? 40 : 28
  var volH = big ? 46 : 24, gap = big ? 8 : 6
  var priceH = H - padT - padB - volH - gap
  var bars = rec.bars || []
  var n = bars.length
  if(n < 2) return ''
  var base = rec.prevC != null ? rec.prevC : bars[0].o
  /* 对称区间：取相对昨收的最大绝对偏离 */
  var dev = 0
  bars.forEach(function(b){
    dev = Math.max(dev, Math.abs(b.h-base), Math.abs(b.l-base), Math.abs(b.c-base), Math.abs(b.o-base))
  })
  ;(marks||[]).forEach(function(mk){ if(mk.p!=null) dev = Math.max(dev, Math.abs(mk.p-base)) })
  if(dev < base*0.001) dev = base*0.005
  var hi = base + dev*1.10, lo = base - dev*1.10
  /* x 轴按「交易分钟」定位：09:30→0，11:30/13:00→120（午休折叠），15:00→240。
     与真实分时图一致；B/S 点因此落在准确的时间位置上。 */
  var xOf = function(t){
    var m = tMin(t)
    if(m == null) m = 0
    return padL + (W-padL-padR) * Math.max(0, Math.min(240, m)) / 240
  }
  var Y = function(p){ return padT + priceH*(hi-p)/(hi-lo) }
  var colOf = function(p){ return p>base ? '#f04a4a' : (p<base ? '#2fbf71' : '#8fa0bf') }
  var last = bars[n-1]
  var chg = (last.c-base)/base
  var fs = big ? 9.5 : 8
  var fs2 = big ? 10.5 : 9

  var g = ''
  g += '<rect x="0" y="0" width="'+W+'" height="'+H+'" fill="#1b2438" rx="8"/>'

  /* 时间网格 + 刻度（09:30 / 10:30 / 11:30|13:00 / 14:00 / 15:00） */
  ;[[0,'09:30'],[60,'10:30'],[120,'11:30 / 13:00'],[180,'14:00'],[240,'15:00']].forEach(function(tk){
    var xx = padL + (W-padL-padR)*tk[0]/240
    if(tk[0] > 0 && tk[0] < 240) g += '<line x1="'+xx.toFixed(1)+'" y1="'+padT+'" x2="'+xx.toFixed(1)+'" y2="'+(padT+priceH).toFixed(1)+'" stroke="#243149" stroke-width="1"/>'
    var anc = tk[0]===0 ? 'start' : (tk[0]===240 ? 'end' : 'middle')
    g += '<text x="'+xx.toFixed(1)+'" y="'+(H-8)+'" fill="#8fa0bf" font-size="'+fs+'" text-anchor="'+anc+'">'+tk[1]+'</text>'
  })

  /* 昨收基准线 */
  var yBase = Y(base)
  g += '<line x1="'+padL+'" y1="'+yBase.toFixed(1)+'" x2="'+(W-padR)+'" y2="'+yBase.toFixed(1)+'" stroke="#8fa0bf" stroke-width="1" stroke-dasharray="4 3" opacity=".6"/>'
  g += '<text x="'+(W-padR+4)+'" y="'+(yBase+3.5).toFixed(1)+'" fill="#8fa0bf" font-size="'+(fs-0.5)+'">昨收 '+base.toFixed(2)+'</text>'
  /* 涨/跌停参考线（若在区间内） */
  ;[[base*1.1,'涨停'],[base*0.9,'跌停']].forEach(function(pair){
    if(pair[0] <= hi && pair[0] >= lo){
      var yy = Y(pair[0])
      g += '<line x1="'+padL+'" y1="'+yy.toFixed(1)+'" x2="'+(W-padR)+'" y2="'+yy.toFixed(1)+'" stroke="#2a3550" stroke-width="1" stroke-dasharray="2 4"/>'
    }
  })

  /* 成交量柱（价格区下方），红涨绿跌 */
  var vmax = 0
  bars.forEach(function(b){ if(b.v > vmax) vmax = b.v })
  var volY0 = padT + priceH + gap + volH
  var bw = Math.max(1.2, (W-padL-padR)/n*0.62)
  if(vmax > 0){
    bars.forEach(function(b){
      var h = Math.max(0.6, volH * (b.v||0) / vmax)
      var col = b.c >= (b.o==null?b.c:b.o) ? '#8f2c2c' : '#1d6b45'
      g += '<rect x="'+(xOf(b.t)-bw/2).toFixed(1)+'" y="'+(volY0-h).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+h.toFixed(1)+'" fill="'+col+'" opacity=".75"/>'
    })
  }
  g += '<line x1="'+padL+'" y1="'+volY0.toFixed(1)+'" x2="'+(W-padR)+'" y2="'+volY0.toFixed(1)+'" stroke="#2a3550" stroke-width="1"/>'
  g += '<text x="'+(W-padR+4)+'" y="'+(volY0-volH/2+3).toFixed(1)+'" fill="#6b7c9b" font-size="'+(fs-0.5)+'">量</text>'

  /* 均价线（累计额/累计量，mid 近似额） */
  var cumV = 0, cumA = 0, avgPts = []
  bars.forEach(function(b){
    var v = b.v||0, mid = (b.h+b.l+b.c)/3
    cumV += v; cumA += mid*v
    avgPts.push({ t:b.t, p: cumV>0 ? cumA/cumV : b.c })
  })
  var apath = avgPts.map(function(q,i){ return (i?'L':'M')+xOf(q.t).toFixed(1)+' '+Y(q.p).toFixed(1) }).join(' ')
  g += '<path d="'+apath+'" fill="none" stroke="#f0a04a" stroke-width="'+(big?1.2:1)+'" opacity=".8"/>'

  /* 分时价格线（从 09:30 开盘价起画） */
  var linePts = [{ t:'09:30', c: bars[0].o }].concat(bars)
  var ppath = linePts.map(function(b,i){ return (i?'L':'M')+xOf(b.t).toFixed(1)+' '+Y(b.c).toFixed(1) }).join(' ')
  g += '<path d="'+ppath+'" fill="none" stroke="'+colOf(last.c)+'" stroke-width="'+(big?1.8:1.6)+'" stroke-linejoin="round"/>'
  g += '<circle cx="'+xOf(last.t).toFixed(1)+'" cy="'+Y(last.c).toFixed(1)+'" r="'+(big?3:2.6)+'" fill="'+colOf(last.c)+'"/>'

  /* ★ B/S 标记：实心点 + 竖虚线对齐时间轴 + 字母 + 成交价小字（mk.pr 传入才画）。
     时间看点的水平位置即可，价格直接写在图上；「今日操作股票」不传 pr，维持原样。 */
  ;(marks||[]).forEach(function(mk){
    if(mk.p == null) return
    var tm = mk.t || (mk.k==='B' ? '09:30' : '14:57')
    var mx = xOf(tm), my = Y(mk.p)
    var isBuy = mk.k === 'B'
    var mc = isBuy ? '#4aa3f0' : '#f0a04a'
    /* 竖虚线：从成交点落到时间轴，直观看出「几点成交」 */
    g += '<line x1="'+mx.toFixed(1)+'" y1="'+my.toFixed(1)+'" x2="'+mx.toFixed(1)+'" y2="'+(H-padB+2).toFixed(1)+'" stroke="'+mc+'" stroke-width="1" stroke-dasharray="2 3" opacity=".45"/>'
    g += '<circle cx="'+mx.toFixed(1)+'" cy="'+my.toFixed(1)+'" r="'+(big?4.6:3.8)+'" fill="'+mc+'" stroke="#0e1420" stroke-width="1.4"/>'
    /* 字母（B/S）标在点上方；★ 2026-10-17 用户要求把成交价也显示在图上——
       价格竖排贴在字母上方，靠近图顶时整体翻到点下方，避免出界。 */
    var ly = my - (big?9:7.5)
    var flip = my < padT + (big?22:19)
    if(flip) ly = my + (big?15:12)
    g += '<text x="'+mx.toFixed(1)+'" y="'+ly.toFixed(1)+'" fill="'+mc+'" font-size="'+(big?11:9.5)+'" font-weight="700" text-anchor="middle">'+mk.k+'</text>'
    if(mk.pr != null){
      var py = flip ? ly + (big?12:10) : ly - (big?12:10.5)
      g += '<text x="'+mx.toFixed(1)+'" y="'+py.toFixed(1)+'" fill="'+mc+'" font-size="'+(big?10:8.5)+'" font-weight="700" text-anchor="middle">'+mk.pr.toFixed(2)+'</text>'
    }
  })

  /* 右上角：当前价 + 涨跌幅 */
  var cc = colOf(last.c)
  g += '<text x="'+(W-padR+4)+'" y="'+(padT+9)+'" fill="'+cc+'" font-size="'+fs2+'" font-weight="700">'+last.c.toFixed(2)+'</text>'
  g += '<text x="'+(W-padR+4)+'" y="'+(padT+21)+'" fill="'+cc+'" font-size="'+(fs-0.5)+'">'+(chg>0?'+':'')+(chg*100).toFixed(2)+'%</text>'

  /* 图例 */
  var lg = ''
  if((marks||[]).length){
    lg = '<div class="mclg">'
      + (marks.some(function(m){return m.k==='B'}) ? '<span><i style="background:#4aa3f0"></i>B 买入</span>' : '')
      + (marks.some(function(m){return m.k==='S'}) ? '<span><i style="background:#f0a04a"></i>S 卖出</span>' : '')
      + '<span><i style="background:#f0a04a;height:2px;border-radius:0"></i>均价</span>'
      + '</div>'
  }
  return '<div class="mchart'+(big?' big':'')+'">'
    + '<div class="mch">'
    +   '<span class="tag '+((tag==='今日买入'||tag==='买入')?'b':((tag==='今日卖出'||tag==='卖出')?'s':'sk'))+'">'+tag+'</span>'
    +   '<span class="mcn">'+esc(name||rec.name||'')+'</span>'
    +   '<span class="mcc">'+esc(rec.code)+'</span>'
    +   (lbc!=null?'<span class="mcl">'+lbc+' 板</span>':'')
    +   '<span class="mcd">'+cnDate(rec.date)+' 分时</span>'
    + '</div>'
    + '<svg viewBox="0 0 '+W+' '+H+'" width="100%" height="auto" preserveAspectRatio="xMidYMid meet">'+g+'</svg>'
    + lg
    + (o.foot ? '<div class="mcfoot">'+o.foot+'</div>' : '')
    + '</div>'
}
/* 从买卖记录构造该票的标记点：[{k:'B'|'S', p:成交价(元), t:'09:35'}]
 * ★ 时间来源优先级：显式 time 字段 > 约定（买入=开盘、卖出=14:57 收盘）。
 *   成交价是「分」，图上是「元」⇒ /100。 */
function marksOf(code, buys, sells){
  var out = []
  ;(buys||[]).forEach(function(b){
    if(b.code!==code) return
    out.push({ k:'B', p: b.buyC!=null ? b.buyC/100 : null, t: b.time || b.buyTime || '09:30' })
  })
  ;(sells||[]).forEach(function(t){
    if(t.code!==code) return
    out.push({ k:'S', p: t.sellC!=null ? t.sellC/100 : null, t: t.time || t.sellTime || sellTimeOf(t) || '14:57' })
  })
  return out
}
function minuteChartsHTML(codes, buys, sells){
  if(!MCHART && !MTRADE) return ''
  if(!codes || !codes.length) return ''
  var out = []
  codes.forEach(function(cc){
    var rec = seriesOf(cc.code)
    if(!rec) return
    var marks = marksOf(cc.code, buys, sells).filter(function(mk){ return mk.p!=null })
    out.push(minuteChartSVG(rec, cc.tag, cc.name, cc.lbc, marks))
  })
  if(!out.length) return ''
  return '<div class="mcharts">'+out.join('')+'</div>'
}

/* ★ 成交明细 · 分时卡片（2026-10-17 晚：表格移除后，这里是成交明细的唯一载体）：
 *   每笔成交（买入腿/卖出腿）一张卡：
 *     · 跨日交易 ⇒ 买入日一张（B 点 + 买价 + 股数）+ 卖出日一张（S 点 + 卖价 + 股数 + 盈亏）；
 *     · 同日买卖 ⇒ 合并一张图标 B/S 双点，卡底同时给买价、卖价、盈亏；
 *     · 持仓中 ⇒ 只画买入日。
 *   该 (code,date) 没有分钟数据（超 20 个交易日保留期）⇒ 降级为文字卡，价格/股数/盈亏照常展示。
 *   卡底小字（.mcfoot）= 股数、盈亏；成交价直接标在分时图 B/S 点旁（mk.pr）。 */
function tradeChartsHTML(evs){
  if((!MCHART || !MCHART.rows) && (!MTRADE || !MTRADE.rows)) return ''
  var out = []
  ;(evs||[]).forEach(function(e){
    if(!e || !e.code) return
    /* 同日买卖：两腿合并成一张卡，在卖出腿处画，买入腿跳过 */
    if(e.tag === 'b' && e.sd === e.d) return
    var isBuy = e.tag === 'b'
    var sameDay = !isBuy && e.sd === e.bd && isFinite(e.bp)

    /* B/S 标记（p 纵轴定位 / pr 是要写在图上的成交价，单位元） */
    var marks = []
    if(sameDay){
      marks.push({ k:'B', p:e.bp/100, t:'09:30', pr:e.bp/100 })
      if(isFinite(e.sp)) marks.push({ k:'S', p:e.sp/100, t:e.tm || '14:57', pr:e.sp/100 })
    } else if(isBuy){
      if(isFinite(e.bp)) marks.push({ k:'B', p:e.bp/100, t:'09:30', pr:e.bp/100 })
    } else if(isFinite(e.sp)){
      marks.push({ k:'S', p:e.sp/100, t:e.tm || '15:00', pr:e.sp/100 })
    }

    /* 卡底小字：股数 / 盈亏 */
    var foot = []
    if(sameDay){
      foot.push('<span>买 <b>'+price(e.bp)+'</b> × '+e.sh+' 股</span>')
      foot.push('<span>卖 <b>'+price(e.sp)+'</b></span>')
      foot.push('<span>盈亏 <b class="'+cls(e.pnl)+'">'+signYuan(e.pnl)+'（'+pct(e.pp)+'）</b></span>')
    } else if(isBuy){
      foot.push('<span>买入 <b>'+price(e.bp)+'</b> × '+e.sh+' 股</span>')
      if(e.open) foot.push('<span>'+esc(e.open)+'</span>')
    } else {
      foot.push('<span>卖出 <b>'+price(e.sp)+'</b> × '+e.sh+' 股</span>')
      foot.push('<span>盈亏 <b class="'+cls(e.pnl)+'">'+signYuan(e.pnl)+'（'+pct(e.pp)+'）</b></span>')
    }
    var footHTML = foot.join('')
    var tagTxt = sameDay ? '当日买卖' : (isBuy ? '买入' : '卖出')

    var rec = seriesOf(e.code, e.d)
    if(rec && marks.length){
      out.push(minuteChartSVG(rec, tagTxt, e.name, e.lbc, marks, { foot:footHTML }))
    } else {
      /* 无分时数据：文字卡降级，信息不丢 */
      var px = marks.map(function(m){ return m.k+' '+m.pr.toFixed(2) }).join(' · ')
      out.push('<div class="mchart"><div class="mch">'
        + '<span class="tag '+(isBuy?'b':'s')+'">'+tagTxt+'</span>'
        + '<span class="mcn">'+esc(e.name)+'</span>'
        + '<span class="mcc">'+esc(e.code)+'</span>'
        + (e.lbc!=null?'<span class="mcl">'+e.lbc+' 板</span>':'')
        + '<span class="mcd">'+cnDate(e.d)+'</span></div>'
        + '<div class="mnochart">分时数据已过保留期（近 20 个交易日）'
        + (px ? '<br>成交价：'+px : '') + '</div>'
        + '<div class="mcfoot">'+footHTML+'</div></div>')
    }
  })
  if(!out.length) return ''
  return '<div class="mcharts wide">'+out.join('')+'</div>'
}

     以前只是安静地显示旧数据，用户看到的是「停在 20 号」却不明白为什么。 */
  if(LIVE.bjDate && String(LIVE.bjDate) !== bjToday()){

  if(lv.todayBuys && lv.todayBuys.length){
