  }
  if(lv.todaySells && lv.todaySells.length){
    h += lv.todaySells.map(function(t){
      var isPrev = t.preview === true || /^【预演/.test(t.reason || '')
      var head = isPrev ? '⏳ <b>预演卖出</b>（未成交）' : '🔵 卖出'
      var nameTxt = isPrev ? ' <b>'+t.name+'</b> @ 现价 ' : ' <b>'+t.name+'</b> @ '
      return '<div class="row'+(isPrev?' prev':'')+'">'+head+nameTxt+price(t.sellC)
        +'　<span class="'+cls(t.pnlC)+'">'+signYuan(t.pnlC)+'（'+pct(t.pnlPct)+'）</span> '+t.reason+'</div>'
    }).join('')
  }
  if(lv.skippedToday && lv.skippedToday.length){
    h += lv.skippedToday.map(function(x){ return '<div class="row">⊘ 弃买 '+x.name+'（'+x.reason+'）</div>' }).join('')
  }
  ;(lv.positions||[]).forEach(function(p){
    h += '<div class="row">持仓 <b>'+p.name+'</b> 现价 <b>'+(p.curC!=null?price(p.curC):'—')+'</b>　浮盈 <span class="'+cls(p.curPnlC)+'">'+(p.curPnlC!=null?signYuan(p.curPnlC)+' 元':'—')+'</span>'+(p.ztNow?' 🔒涨停中':'')+'</div>'
  })
  if(!(lv.todayBuys||[]).length && !(lv.todaySells||[]).length && !(lv.positions||[]).length){
    h += '<div class="row">今日暂无操作（候选 '+(lv.nextCandidates?lv.nextCandidates.length:0)+' 只待明日开盘）</div>'
  }
  h += '</div></div>'
  box.innerHTML = h
  box.style.display = 'block'
}

/* ---------- QMT 实盘区 ----------
 * 数据来自 data/qmt-live.json：qmt/_snapshot_qmt.py 在 QMT 里用 xtquant 只读采集
 * （账户/持仓/当日委托/当日成交/策略状态/一致性校验），计划任务每 10 分钟推一次。
 * ★ 价格不靠它：这里同样用东财 JSONP 直连行情覆盖持仓现价，所以页面上的
 *   持仓浮盈是实时的，采集帧只负责「有哪些持仓、今天成了哪些单」。
 * ★ 采集帧过期/离线一律显式标注，不安静显示旧数字。 */
var QMT = null
var QMT_QUOTE_AT = null

function loadQmt () {
  fetch('./data/qmt-live.json?_=' + Date.now(), { cache: 'no-store' })
    .then(function (r) { return r.ok ? r.json() : null })
    .then(function (j) { if (j) { QMT = j; renderQmt(); applyQmtQuotes() } })
    .catch(function () { /* 保留上一次 */ })
}

function qmtMoney (c) {
  if (c == null || !isFinite(c)) return '—'
  return (c / 100).toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 })
}

function qmtAgeMin () {
  if (!QMT || !QMT.updated) return null
  var t = new Date(QMT.updated).getTime()
  return isFinite(t) ? (Date.now() - t) / 60000 : null
}

/* 用直连行情覆盖 QMT 持仓现价，重算市值/当日盈亏（昨收净值来自采集帧的 prevTotalC） */
function applyQmtQuotes () {
  if (!QMT || !QMT.ok || QMT.stale || QMT.phase !== 'trading') return
  if (qmtDate8() !== bjToday().replace(/-/g, '')) return
  var ps = QMT.positions || []
  if (!ps.length) return
  var codes = []
  ps.forEach(function (p) { if (codes.indexOf(p.code6) < 0) codes.push(p.code6) })
  jsonpQuotes(codes, function (m) {
    if (!m) return
    var mv = 0, touched = false
    ps.forEach(function (p) {
      var q = m[p.code6]
      if (q && Number(q.f2) > 0) { p.curC = Math.round(Number(q.f2) * 100); touched = true }
      p.pnlC = (p.curC - p.openC) * p.shares
      p.pnlPct = p.openC ? (p.curC / p.openC - 1) : null
      mv += p.curC * p.shares
    })
    if (!touched) return
    QMT_QUOTE_AT = new Date()
    var a = QMT.account || {}
    a.mvC = mv
    a.totalC = (a.cashC || 0) + mv
    if (a.prevTotalC > 0) {
      a.dayPnlC = a.totalC - a.prevTotalC
      a.dayRet = a.dayPnlC / a.prevTotalC
    }
    renderQmt()
  })
}

function qmtDate8 () {
  return QMT ? String(QMT.bjDate8 || String(QMT.bjDate || '').replace(/-/g, '')) : ''
}

function renderQmt () {
  var box = document.getElementById('aux-qmt')
  if (!QMT) { box.style.display = 'none'; var c0 = document.getElementById('aux-cmp'); if (c0) c0.style.display = 'none'; return }
  var a = QMT.account || {}
  var age = qmtAgeMin()
  var staleDay = qmtDate8() !== bjToday().replace(/-/g, '')
  var bad = QMT.stale || !QMT.ok
  var grade = bad ? ['离线', 'closed'] : (staleDay ? ['非今日帧', 'closed'] : (age != null && age > 25 ? ['采集滞后', 'pre-open'] : ['在线', 'trading']))
  var h = '<div class="hd"><b>QMT 实盘</b>'
    + '<span class="badge ' + grade[1] + '">' + grade[0] + '</span>'
    + '<span style="color:var(--tx2);font-size:12px">' + esc(a.id || '') + ' · 华鑫模拟 · 只读采集</span>'
    + '<span style="color:var(--tx2);font-size:10.5px;margin-left:auto">'
    + '采集 ' + esc(String(QMT.updated || '').slice(11, 19)) + (age != null ? '（' + Math.round(age) + ' 分钟前）' : '')
    + (QMT_QUOTE_AT ? ' · 行情 ' + QMT_QUOTE_AT.toTimeString().slice(0, 8) + ' 直连' : '')
    + '</span></div>'

  if (bad) {
    h += '<div class="note" style="color:#e0703a;font-weight:600">⚠ ' + esc(QMT.note || 'QMT 未连接（客户端没开或未登录）')
      + '　下面是最后一次成功的快照' + (QMT.staleSince ? '（' + esc(String(QMT.staleSince).slice(0, 16).replace('T', ' ')) + '）' : '') + '，不是实时状态。</div>'
  } else if (staleDay) {
    h += '<div class="note" style="color:#e0703a">⚠ 采集帧日期是 ' + esc(QMT.bjDate) + '，不是今天。持仓与成交以该日为准。</div>'
  } else if (age != null && age > 25) {
    h += '<div class="note">采集已 ' + Math.round(age) + ' 分钟未更新（计划任务应在盘中每 10 分钟跑一次）。持仓价格仍是实时直连的。</div>'
  }

  h += '<div class="lv-grid"><div class="lv">'
  h += '<div class="nm">总资产 <b>' + qmtMoney(a.totalC) + '</b>　当日 <span class="' + cls(a.dayRet) + '">'
    + (a.dayPnlC == null ? '待次日' : signYuan(a.dayPnlC) + ' 元（' + pct(a.dayRet) + '）') + '</span></div>'
  h += '<div class="row">可用 ' + qmtMoney(a.cashC) + '　持仓市值 ' + qmtMoney(a.mvC)
    + '　持仓 <b>' + (QMT.positions || []).length + '</b>/2'
    + (a.dayPnlC == null ? '　<span style="color:var(--tx2)">（当日盈亏需有上一交易日净值记录，今天首次采集）</span>' : '') + '</div>'

  ;(QMT.positions || []).forEach(function (p) {
    h += '<div class="row">持仓 <b>' + esc(p.name || p.code6) + '</b> <span style="color:var(--tx2)">' + esc(p.code6) + '</span> '
      + p.shares.toLocaleString('zh-CN') + '股　成本 <b>' + price(p.openC) + '</b>　现价 <b>' + price(p.curC) + '</b>'
      + '　浮盈 <span class="' + cls(p.pnlC) + '">' + signYuan(p.pnlC) + ' 元（' + pct(p.pnlPct) + '）</span>'
      + (p.canUse === 0 ? ' <span style="color:var(--tx2);font-size:11px">T+1 今日不可卖</span>' : '')
      + (p.buyDate ? ' <span style="color:var(--tx2);font-size:11px">持仓自 ' + esc(p.buyDateApprox ? '≈' : '') + esc(p.buyDate) + '</span>' : '')
      + '</div>'
  })
  if (!(QMT.positions || []).length) h += '<div class="row">空仓</div>'

  var tr = QMT.trades || []
  if (tr.length) {
    tr.forEach(function (t) {
      var buy = t.side === 'buy'
      h += '<div class="row">' + (buy ? '🔴 买入' : '🔵 卖出') + ' <b>' + esc(t.name || t.code6) + '</b> '
        + t.shares.toLocaleString('zh-CN') + '股 @ <b>' + price(t.avgC) + '</b>'
        + '　<span style="color:var(--tx2);font-size:11px">' + esc(t.at) + ' · ' + esc(t.remark || '') + '</span>'
        + (t.isStrategy ? ' <span style="color:var(--good);font-size:11px">策略单</span>' : ' <span style="color:#e0703a;font-size:11px">人工单</span>')
        + '</div>'
    })
  } else {
    h += '<div class="row">今日无成交</div>'
  }
  var badOrders = (QMT.orders || []).filter(function (o) { return o.status === 57 || o.filled === 0 })
  if (badOrders.length) {
    h += '<div class="row" style="color:#e0703a">废单 ' + badOrders.length + ' 笔：'
      + badOrders.map(function (o) { return esc(o.code6) + ' ' + o.shares + '股@' + price(o.priceC) + '（' + esc(o.at) + '）' }).join('、') + '</div>'
  }
  h += '</div></div>'

  box.innerHTML = h
  box.style.display = 'block'

  /* ---- 与云端模拟账对比 + 策略一致性（独立渲染到辅助信息页的对比区） ---- */
  var cmp = document.getElementById('aux-cmp')
  cmp.innerHTML = '<div class="qmt-cmp"><div class="qchd">与云端模拟账（E1）对比</div>'
    + compareRows() + consistencyBlock() + '</div>'
  cmp.style.display = 'block'
}

/* 对比：持仓 / 今日成交 / 情绪闸门。
 * ★ 2026-10-21：公开页面只给「结果状态」，不输出任何代码、股数、价格、阈值、分位数，
 *   避免从比对明细反推策略规则。明细留在本地 qmt-live.json（私有仓库全量）。 */
function crow (label, state, note) {
  var map = {
    same: '<span style="color:var(--good);font-weight:600">✓ 一致</span>',
    diff: '<span style="color:#e0703a;font-weight:600">✗ 不同</span>',
    ref: '<span style="color:var(--tx2)">参考（不判定）</span>',
    na: '<span style="color:var(--tx2)">无法比对</span>'
  }
  return '<div class="crow"><span class="ck">' + label + '</span><span class="cv">' + (note || '') + '</span>'
    + (map[state] || '') + '</div>'
}

function compareRows () {
  var main = (DATA && DATA.mainId) || 'E1'
  var sim = null
  ;((LIVE && LIVE.strategies) || []).forEach(function (x) { if (x.id === main) sim = x })
  var risk = null
  ;((DATA && DATA.strategies) || []).forEach(function (x) { if (x.id === main) risk = x.risk })
  var qp = (QMT.positions || []).map(function (p) { return p.code6 }).sort()
  var sp = ((sim && sim.positions) || []).map(function (p) { return p.code }).sort()
  /* 持仓：两套独立账户（起点与建仓日均不同），不同是必然，只作参考不判红 */
  var posSame = qp.join(',') === sp.join(',')

  var qb = (QMT.trades || []).filter(function (t) { return t.side === 'buy' && t.isStrategy })
  var qs = (QMT.trades || []).filter(function (t) { return t.side === 'sell' && t.isStrategy })
  var sb = (sim && sim.todayBuys) || []
  /* 模拟账的 todaySells 里含「预演」项，剔掉才是真成交 */
  var ssAll = (sim && sim.todaySells) || []
  var ss = ssAll.filter(function (x) { return !(x.preview === true || /^【预演/.test(x.reason || '')) })
  var bs = qb.map(function (t) { return t.code6 }).sort().join(',') === sb.map(function (x) { return x.code }).sort().join(',')
  var sss = qs.map(function (t) { return t.code6 }).sort().join(',') === ss.map(function (x) { return x.code }).sort().join(',')

  var g = QMT.gate
  var qClose = g ? g.closed : null
  var sClose = risk ? risk.gateToday : null
  var qG = g && g.date ? String(g.date) : ''
  var sG = (DATA && DATA.date) ? dnum(DATA.date) : ''
  var sameGateDay = qG && sG && qG === sG

  var out = ''
  out += crow('持仓', posSame ? 'ref' : 'ref', posSame ? '' : '<span style="font-size:11px;opacity:.7">两套独立账户</span>')
  out += crow('今日策略买入', bs ? 'same' : 'diff')
  out += crow('今日策略卖出', sss ? 'same' : 'diff')
  out += crow('情绪闸门',
    (qClose == null || sClose == null) ? 'na' : (sameGateDay ? (qClose === sClose ? 'same' : 'diff') : 'na'),
    sameGateDay ? '' : '<span style="font-size:11px;opacity:.7">日期不同</span>')
  return out
}

function consistencyBlock () {
  /* ★ 2026-10-21：只给「同源 / 有分歧」，不输出比对项数、参数名、参数值、待买队列、策略日志，
     这些都会让人反推规则。明细只在本地 qmt-live.json（私有仓库）。 */
  var c = QMT.consistency
  if (!c) return crow('策略一致性', 'na', '<span style="font-size:11px;opacity:.7">未采集</span>')
  if (c.ok === null || c.error) return crow('策略一致性', 'diff', '<span style="font-size:11px;opacity:.7">校验失败</span>')
  return crow('策略一致性', c.ok ? 'same' : 'diff',
    '<span style="font-size:11px;opacity:.7">校验于 ' + esc(c.at) + '</span>')
}

/* ---------- 滚动验证：弱化为 M2 卡片里的一个小标签 ----------
 * ★ 2026-10-16 用户要求：「方向成立」弱化显示，作为一个标签挂在 M2 跟随里，不显示那么多细节。
 *   原实现是顶部整条常驻状态条（含「多窗口 5/10/20 日」「显著性检验需 2831 交易日」长文案）。
 *   现改为：只在 M2 卡片「今日跟随」那一行右侧显示一个状态徽章 + 一句极简说明。
 *   status 四档：green 方向成立 / watch 观察中 / degrade 建议降级 / insufficient 样本不足。
 *   ★ 保留 rolling 数据获取本身（dashboard.json.rolling / LIVE.rolling），只改呈现。 */
var ROLL_LBL = { green: '🟢 方向成立', watch: '🟡 观察中', degrade: '🔴 建议降级', insufficient: '⚪ 样本不足' }
function rollingOf(d){
  var rr = d && d.rolling
  if(LIVE && LIVE.rolling && d && String(LIVE.bjDate) > String(d.date)) rr = LIVE.rolling
  return rr || null
}
/* 返回一个小徽章（+可选一句说明）；无数据返回空串 */
function rollTagHTML(d, withNote){
  var rr = rollingOf(d)
  if(!rr) return ''
  var st = ROLL_LBL[rr.status] || ('⚪ '+(rr.status||'—'))
  return '<span class="rolltag '+rr.status+'" title="滚动验证：每 20 交易日复检一次，监控这套跟随逻辑何时失效">'+st+'</span>'
    + (withNote && rr.note ? '<span class="rollnote">'+esc(rr.note)+'</span>' : '')
}

function card(t, v, cl, m){
  return '<div class="card"><div class="t">'+t+'</div><div class="v '+cl+'">'+v+'</div><div class="m">'+m+'</div></div>'
}

/* ---------- 主渲染 ---------- */
function render(d){
  DATA = d
  var S = mergedStrategies()
  if(!S.length) return
  /* ★ 默认选中主策略；若 CUR 落在隐藏列表（M2/S2）或被删掉，回落到主策略 */
  if(!stratById(CUR) || HIDE.indexOf(CUR) >= 0) CUR = (DATA.mainId && stratById(DATA.mainId)) ? DATA.mainId : visibleOf(S)[0].id
  renderSide()
  renderHero()
  renderDataAge()
  renderLive()
  renderDetail('main')
  renderDetail('aux')
  renderQmt()
  renderSwitchInfo()
  drawChart()
}

/* M2 切换轨迹（近 30 日变化点）
 * ★ 位置：原先贴在「收益曲线」窗口按钮那一行，又长又挤（10 段轨迹把窗口按钮顶开）。
 *   现改为渲染进 M2 详情卡片内，且默认折叠成一行摘要，点开才看全轨迹。 */
function switchInfoHTML(){
  var s = stratById('M2')
  if(!s || !s.m2 || !s.m2.switches || s.m2.switches.length<2) return ''
  var sw = s.m2.switches
  var head = sw[0], tail = sw[sw.length-1]
  var trace = sw.map(function(x){ return mmdd(x.date)+' '+x.name }).join(' → ')
  return '<div class="swrow" id="swrow">'
    + '<div class="swsum" id="swsum" title="M2 近 30 个交易日的跟随切换轨迹（只列变化点）：昨日收盘按近 10 日净值涨幅重新排名，最强者即今日执行">'
    + '切换轨迹：<b>'+sw.length+'</b> 段 · 从 <b>'+head.name+'</b>（'+mmdd(head.date)+'）到 <b>'+tail.name+'</b>（'+mmdd(tail.date)+'）　<span class="swmore">展开 ▾</span></div>'
    + '<div class="swfull" id="swfull" style="display:none">'+trace+'</div>'
    + '</div>'
}
function renderSwitchInfo(){
  /* 折叠/展开交互（详情区每次重渲后需重新绑定） */
  var sum = document.getElementById('swsum')
  if(sum) sum.onclick = function(){
    var f = document.getElementById('swfull')
    var open = f.style.display !== 'none'
    f.style.display = open ? 'none' : 'block'
    this.querySelector('.swmore').textContent = open ? '展开 ▾' : '收起 ▴'
  }
}

/* ---------- 收益曲线（累计收益率 %；用全区间回放曲线，避免上线即空白） ---------- */
function drawChart(){
  var svg = document.getElementById('chart')
  if(!DATA) return
  var W = svg.clientWidth || 900, H = 250, padL = 52, padR = 14, padT = 14, padB = 26
  var S = visibleOf(mergedStrategies())

  /* ★ 2026-10-20 改：曲线默认只画「线上模拟」区间（daily = 上线日至今的真实模拟账户）。
     旧行为画的是 curve（同参数 6 年历史回放），那是回测、不是模拟盘，还会撑爆 Y 轴。
     两个模式：live = 模拟账户（默认）；replay = 历史回放（保留备查）。
     ★ 盘中实时点已由 mergedStrategies 追加进 daily，live 模式天然包含今天。 */
  var isLive = (MODE === 'live')
  var series = S.map(function(s){
    var pts, replay = false
    if(isLive){
      pts = (s.daily || []).slice()
    }else{
      var base = (s.curve && s.curve.length>1) ? s.curve : (s.daily||[])
      replay = !!(s.curve && s.curve.length>1)
      pts = base.slice()
      /* 把 daily 里比 base 更新的点（= 盘中实时追加的当日点）并进来 */
      if(s.live && s.daily && s.daily.length){
        var have = Object.create(null); pts.forEach(function(p){ have[p.d]=1 })
        s.daily.forEach(function(p){ if(!have[p.d]) pts.push(p) })
      }
    }
    return { id:s.id, name:s.name, replay:replay,
      pts: pts.map(function(e){ return { d:e.d, v:e.cr*100 } }) }
  }).filter(function(s){ return s.pts.length })
  /* 只画当前选中的策略（单策略聚焦），但保留其它策略的浅色底图做参照 */
  var focus = series.filter(function(s){ return s.id===CUR })[0]
  if(!focus || !focus.pts.length){ svg.innerHTML=''; return }

  var dateSet = Object.create(null), allDates = []
  series.forEach(function(s){ s.pts.forEach(function(p){ if(!dateSet[p.d]){ dateSet[p.d]=1; allDates.push(p.d) } }) })
  if(!allDates.length){ svg.innerHTML=''; return }
  allDates.sort()
  /* live 模式只有上线至今几个交易日，不做窗口裁剪（裁了就没图）；窗口按钮只在 replay 模式可用 */
  var from = (!isLive && WIN>0) ? Math.max(0, allDates.length-WIN) : 0
  var view = allDates.slice(from)
  var xi = Object.create(null); view.forEach(function(d,i){ xi[d]=i })
  var n = view.length

  /* 窗口内重新归一（每条曲线起点 = 0%）。
     replay 模式：S3 六年回放 +4600% 会把 Y 轴撑到几千个百分点，窗口内其它策略被压成贴底细线。
     live 模式：正常策略首点本就是 0（等于没变）；但 M2 这类「本金口径不同」的对照策略
     首点 cr 是 −80%，归一后才是它相对上线日的真实走势，不会把 Y 轴拽到 −80%。 */
  series.forEach(function(s){
    var inV = s.pts.filter(function(p){ return xi[p.d]!=null })
    if(!inV.length) return
    var denom = Math.max(1 + inV[0].v/100, 0.001)   // 防 cr ≤ −100% 时除零
    s.pts = s.pts.map(function(p){
      return xi[p.d]==null ? p : { d:p.d, v:((1+p.v/100)/denom-1)*100 }
    })
  })

  /* Y 轴范围：以「当前选中策略」的走势为主（含 0 轴），不放任其它策略把它拉爆。
     旧做法取所有曲线的 min/max —— M2 这类对照策略某天 −15%，会把 E1 的 5 个点压成 10px 一条。
     超出范围内的底图曲线由 clipPath 裁掉，不会画到框外。 */
  var fvals = focus.pts.filter(function(p){ return xi[p.d]!=null }).map(function(p){ return p.v })
  var fmin = Math.min.apply(null, fvals), fmax = Math.max.apply(null, fvals)
  var mn = Math.min(0, fmin), mx = Math.max(0, fmax)
  var pad = Math.max((mx-mn)*0.30, 0.25); mn-=pad; mx+=pad
  var X = function(i){ return padL + (n<2 ? 0 : (W-padL-padR)*i/(n-1)) }
  var Y = function(v){ return padT + (H-padT-padB)*(mx-v)/(mx-mn) }

  var g = '<defs><clipPath id="cclip"><rect x="'+padL+'" y="'+padT+'" width="'+(W-padL-padR)+'" height="'+(H-padT-padB)+'"/></clipPath></defs>'
    + '<rect x="0" y="0" width="'+W+'" height="'+H+'" fill="#161e2e" rx="8"/>'
  for(var k=0;k<=4;k++){
    var vv = mn + (mx-mn)*k/4, yy = Y(vv)
    g += '<line x1="'+padL+'" y1="'+yy+'" x2="'+(W-padR)+'" y2="'+yy+'" stroke="#2a3550" stroke-width="1"'+(Math.abs(vv)<1e-9?' stroke-dasharray="4 3"':'')+'/>'
      + '<text x="'+(padL-6)+'" y="'+(yy+4)+'" fill="#8fa0bf" font-size="11" text-anchor="end">'+vv.toFixed(1)+'%</text>'
  }
  var lbl = [0, Math.floor((n-1)/2), n-1]
  lbl.forEach(function(gi,li){
    var dd = view[gi]; if(!dd) return
    g += '<text x="'+X(gi)+'" y="'+(H-8)+'" fill="#8fa0bf" font-size="11" text-anchor="'+(li===0?'start':(li===2?'end':'middle'))+'">'+mmdd(dd)+'</text>'
  })

  /* 底图：其它策略（细、半透明）；与主图一起被裁剪在绘图区内 */
  g += '<g clip-path="url(#cclip)">'
  series.forEach(function(s){
    if(s.id===CUR) return
    var pts = s.pts.filter(function(p){ return xi[p.d]!=null })
    if(!pts.length) return
    var path = pts.map(function(p,i){ return (i?'L':'M')+X(xi[p.d]).toFixed(1)+' '+Y(p.v).toFixed(1) }).join(' ')
    g += '<path d="'+path+'" fill="none" stroke="'+colorOf(s.id)+'" stroke-width="1" opacity=".28" stroke-linejoin="round"/>'
  })
  /* 主图：当前选中策略 */
  var fpts = focus.pts.filter(function(p){ return xi[p.d]!=null })
  var fpath = fpts.map(function(p,i){ return (i?'L':'M')+X(xi[p.d]).toFixed(1)+' '+Y(p.v).toFixed(1) }).join(' ')
  var fc = colorOf(focus.id)
  /* 回放段用虚线前缀提示（整条都是回放则整体虚线） */
  g += '<path d="'+fpath+'" fill="none" stroke="'+fc+'" stroke-width="2.2" stroke-linejoin="round"'+(focus.replay?' stroke-dasharray="6 3"':'')+'/>'
  g += '</g>'
  var last = fpts[fpts.length-1]
  g += '<circle cx="'+X(xi[last.d])+' cy="'+Y(last.v)+'" r="3.5" fill="'+fc+'"/>'
    + '<text x="'+(X(xi[last.d])-6)+'" y="'+(Y(last.v)-8)+'" fill="'+fc+'" font-size="11" text-anchor="end" font-weight="600">'+pct(last.v/100)+'</text>'

  /* 线上模拟只有 1 个交易日时画不出线（单点），给明确文字而不是一片空白 */
  if(n < 2){
    g += '<text x="'+(W/2)+'" y="'+(H/2+20)+'" fill="#8fa0bf" font-size="13" text-anchor="middle">'
      + '线上模拟仅 '+n+' 个交易日（'+(DATA.startDate||'')+' 起）：首日累计 '+pct(last.v/100)+'，收盘后自动出线</text>'
  }
  svg.setAttribute('viewBox','0 0 '+W+' '+H)
  svg.innerHTML = g

  var sub = isLive
    ? (n<2 ? '线上模拟第 1 个交易日（'+(DATA.startDate||'')+' 起）'
           : '线上模拟实测 · '+n+' 个交易日（'+(DATA.startDate||'')+' 起，起点归一 0%）')
    : '历史回放 · 窗口内收益（各曲线起点归一 0%，窗口起点 '+mmdd(view[0])+'）'
  document.getElementById('chartTitle').innerHTML = focus.id+' · '+displayName(focus)+'　<small>'+sub+'</small>'
  document.getElementById('legend').innerHTML =
    '<span>'+(focus.replay?'<i style="background:repeating-linear-gradient(90deg,'+fc+' 0 6px,transparent 6px 9px)"></i>':'<i style="background:'+fc+'"></i>')+focus.id+(isLive?'（模拟盘）':'（回放）')+'</span>'
    + series.filter(function(s){ return s.id!==CUR }).map(function(s){ return '<span><i style="background:'+colorOf(s.id)+';opacity:.45"></i>'+s.id+'</span>' }).join('')
  /* ★ 原「曲线下方橙色长框」已移除（内容与底部「曲线口径」重复、手机上占地）。
     这里只把动态项（回放真实起点/交易日数）回填到底部说明里，保持单一处、不重复。 */
  var fsEl = document.getElementById('fStart'), frEl = document.getElementById('fReplay')
  if(fsEl) fsEl.textContent = DATA.startDate || '—'
  if(frEl) frEl.textContent = DATA.replayStart || '—'
}

/* 模式切换（线上模拟 / 历史回放）与窗口切换分开绑定：
   旧版把所有 .winbar button 都当窗口按钮，加了模式按钮后点「线上模拟」会把 WIN 变成 NaN */
document.querySelectorAll('.winbar button').forEach(function(b){
  if(b.dataset.m){
    b.onclick = function(){
      document.querySelectorAll('.winbar button[data-m]').forEach(function(x){ x.classList.remove('on') })
      this.classList.add('on')
      MODE = this.dataset.m
      var ww = document.getElementById('winwrap')
      if(ww) ww.style.display = (MODE==='replay') ? 'inline-flex' : 'none'
      drawChart()
    }
  }else{
    b.onclick = function(){
      document.querySelectorAll('.winbar button[data-w]').forEach(function(x){ x.classList.remove('on') })
      this.classList.add('on'); WIN = +this.dataset.w; drawChart()
    }
  }
})
window.addEventListener('resize', function(){
  if(DATA) drawChart()
  /* ★ 从手机宽度转回 PC 宽度时，抽屉的 open 状态会遗留（overflow 锁死、遮罩残留）⇒ 强制收干净 */
  if(window.innerWidth > 900 && sideIsOpen()) closeSide()
})

/* ---------- 移动端抽屉事件 ---------- */
document.getElementById('menubtn').onclick = function(){ sideIsOpen() ? closeSide() : openSide() }
document.getElementById('scrim').onclick = closeSide
document.getElementById('sideclose').onclick = closeSide
document.addEventListener('keydown', function(e){ if(e.key === 'Escape' && sideIsOpen()) closeSide() })

/* ★ S3 体检状态条（data/health.json 由 s3-health.js 每日收盘后生成） */
/* ★ 2026-10-21：S3 体检改为本地定期执行，公开页不再拉 data/health.json，也不再挂体检入口。 */

loadLive()
loadQmt()
loadMinuteChart()
loadSeries()
setInterval(loadLive, 60000)
/* ★ 2026-10-21：行情独立 30 秒一刷（不跟 60 秒的静态帧走），见 applyQuotes 注释 */
setInterval(applyQuotes, 30000)
setInterval(loadSeries, 60000)
/* QMT 采集帧 10 分钟才更新一次，但页面 60 秒查一次「有没有新帧」成本很低，且能第一时间发现变新 */
setInterval(loadQmt, 60000)
setInterval(applyQmtQuotes, 30000)
fetchJSON()
</script>
<script>
/* ---- QMT 策略健康横幅：status!=ok 时在页面顶部告警（数据由 qmt/check_e1_health.py 每 10 分钟生成） ---- */
(function () {
  var box = document.getElementById('qmtHealth')
  if (!box) return
  function paint(h) {
    if (!h || !h.status || h.status === 'ok') { box.style.display = 'none'; return }
    var isErr = h.status === 'error'
    var color = isErr ? '#ef4444' : '#f59e0b'
    var bg = isErr ? 'rgba(239,68,68,.13)' : 'rgba(245,158,11,.13)'
    var msgs = (h.alerts || []).filter(function (a) { return a.level !== 'info' })
      .map(function (a) { return a.msg }).slice(0, 4)
    box.style.display = 'block'
    box.style.margin = '0 0 12px'
    box.style.border = '1px solid ' + color
    box.style.background = bg
    box.style.borderRadius = '10px'
    box.style.padding = '10px 14px'
    box.style.fontSize = '13px'
    box.style.lineHeight = '1.65'
    box.innerHTML =
      '<div style="font-weight:700;color:' + color + '">QMT 策略：' + h.headline +
      '<span style="font-weight:400;opacity:.7;margin-left:8px">检查于 ' + h.checkedAt + '</span></div>' +
      (msgs.length ? '<div style="margin-top:4px;opacity:.92">' + msgs.join('<br>') + '</div>' : '') +
      '<div style="margin-top:4px;opacity:.6">最后日志 ' + (h.lastLogAt || '无') +
      '　距检查 ' + (h.lastLogAgeMin === null || h.lastLogAgeMin === undefined ? '-' : h.lastLogAgeMin) + ' 分钟' +
      '　QMT ' + (h.qmtRunning ? '在运行' : '未运行') + '</div>'
  }
  function pull() {
    fetch('./data/qmt-health.json?_=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : null })
      .then(paint).catch(function () {})
  }
  pull()
  setInterval(pull, 300000)
})()
</script>
</body>
