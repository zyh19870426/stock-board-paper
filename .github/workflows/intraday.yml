name: intraday-paper
# 交易日（周一~周五）北京时间 09:00–14:45 每 15 分钟一次 + 15:05 收盘后最后一帧
# GitHub 的 cron 用 UTC：1-6 点 UTC = 09:00–14:45 北京时间；07:05 UTC = 15:05 北京
on:
  schedule:
    - cron: '*/15 1-6 * * 1-5'
    - cron: '5 7 * * 1-5'
  workflow_dispatch: {}        # 允许手动触发（测试用）

permissions:
  contents: write

concurrency:
  group: intraday-paper
  cancel-in-progress: true     # 只保留最新一帧，旧的没跑完直接作废

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 盘中实时预演（写 data/intraday.json，绝不改数据集）
        run: node intraday.js

      - name: 提交盘中快照
        run: |
          git config user.name  "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
          git pull --rebase origin main || true
          git add data/intraday.json
          if git diff --cached --quiet; then
            echo "盘中快照无变化"
          else
            git commit -m "intraday $(TZ=Asia/Shanghai date +'%F %H:%M')"
            git push
          fi
