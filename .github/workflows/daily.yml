name: daily-paper
# 每个交易日（周一~周五）北京时间 15:40 左右自动跑一次
# GitHub 的 cron 用 UTC：07:40 UTC = 15:40 北京时间（实际触发可能延迟几分钟到半小时，无碍）
on:
  schedule:
    - cron: '40 7 * * 1-5'
  workflow_dispatch: {}        # 允许在 Actions 页面手动触发（测试用）

permissions:
  contents: write              # 允许把当日数据/报告提交回仓库

concurrency:
  group: daily-paper
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 推进模拟账户（更新数据集 + 重放两套策略 + 日报）
        run: node daily.js
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          SENDKEY: ${{ secrets.SENDKEY }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}

      # 云端轻量体检：不依赖本地 154MB 全历史数据集，只用滚动 store 算
      # 数据新鲜度 / 配置基线 / 近20·60日绩效 / 连板率 / 回撤；异常时主动推送并提示排查。
      # 全历史风格分档等深度项仍在本地 s3-health.js 做。
      - name: S3 云端轻量体检
        run: node cloud-health.js
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          SENDKEY: ${{ secrets.SENDKEY }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}

      - name: 提交当日数据与报告
        run: |
          git config user.name  "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
          git pull --rebase origin main || true
          git add -A
          if git diff --cached --quiet; then
            echo "今天没有需要提交的变更"
          else
            git commit -m "daily $(TZ=Asia/Shanghai date +'%F %H:%M')"
            git push
          fi
